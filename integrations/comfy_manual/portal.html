<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>本地千问生图</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0e121b;color:#e8edf7;font:15px/1.6 system-ui,"Microsoft YaHei",sans-serif}main{max-width:1160px;margin:40px auto;padding:0 24px}h1{font-size:29px;margin:0}p{color:#a6b3c9}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:28px}a{color:#a9c4ff}section{background:#171e2b;border:1px solid #2b374b;border-radius:16px;padding:24px;margin-bottom:22px}label{display:block;margin-bottom:10px;font-weight:600}textarea,select,input{background:#0e1522;color:#e8edf7;border:1px solid #38465e;border-radius:8px;padding:12px;font:inherit}textarea{width:100%;min-height:150px;resize:vertical}button,.upload{cursor:pointer;border:0;border-radius:9px;padding:11px 19px;background:#437aee;color:white;font:inherit}button:disabled{opacity:.5;cursor:wait}.secondary{background:#2a374e}.controls{display:flex;gap:20px;flex-wrap:wrap;margin:20px 0}.controls input{width:160px}.refs{display:flex;gap:14px;flex-wrap:wrap;margin-top:16px}.ref{width:140px;background:#0e1522;border-radius:10px;padding:8px}.ref img{width:124px;height:110px;object-fit:contain}.ref button{padding:3px 8px;font-size:12px;margin:2px}.ref span{display:block;font-size:13px}.hint{font-size:13px;color:#9eacc1}.error{color:#ffaeae;white-space:pre-wrap}#status{margin-left:14px}#results{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}.result{border:1px solid #324158;border-radius:12px;padding:15px;overflow:hidden}.result img{width:100%;border-radius:8px}.result p{white-space:pre-wrap;overflow-wrap:anywhere;font-size:13px}.path{color:#a9c4ff}h2{font-size:19px;margin-top:0}#drop{border:1px dashed #536989;border-radius:10px;padding:20px}#drop.over{background:#273b5b}
.history-top,.result-top{display:flex;justify-content:space-between;align-items:center;gap:12px}.history-top{flex-wrap:wrap}.history-top h2{margin:0}.history-tools{display:flex;gap:8px}.danger{background:transparent;color:#ffb4b4;border:1px solid #70434c;padding:5px 10px;font-size:13px}.history-tools button{padding:7px 12px;font-size:13px}[hidden]{display:none!important}#record-status{min-height:21px;margin:12px 0;color:#a6b3c9;font-size:13px}</style>
<main><header><div><h1>本地千问生图</h1><p>文字描述 · 单图参考 · 多图融合</p></div><a href="http://127.0.0.1:8188/" target="_blank" rel="noopener">打开 ComfyUI 工作流 ↗</a></header>
<section><label for="prompt">你想生成什么？</label><textarea id="prompt" maxlength="6000" placeholder="例如：参考图1的人物外观，结合图2的配色，生成适合 APP 图标的正面头像，简洁背景。"></textarea>
<div style="margin-top:22px"><label>参考图片 <span class="hint">可选；不上传即为纯文字生图</span></label><div id="drop"><label class="upload" for="files" style="display:inline-block;margin:0">＋ 添加参考图片</label><input id="files" type="file" accept="image/png,image/jpeg,image/webp" multiple hidden><span class="hint"> 支持拖入 PNG / JPG / WebP，最多16张；建议先用1–3张</span></div><div id="refs" class="refs"></div></div>
<p class="hint">提示词中可写“图1”“图2”说明各图用途。第一张参考图决定输出宽高比例；纯文字默认正方形。多图会增加显存和耗时。</p>
<div class="controls"><div><label for="resolution">画面尺寸</label><select id="resolution"><option value="512">512 · 快速试图</option><option value="768" selected>768 · 默认</option><option value="1024">1024 · 更精细</option></select></div><div><label for="steps">步数</label><input id="steps" type="number" min="1" max="60" value="8"></div><div><label for="seed">种子（-1为随机）</label><input id="seed" type="number" min="-1" max="4294967295" value="-1"></div></div>
<button id="generate">开始生成</button><span id="status" role="status"></span><p id="error" class="error" role="alert"></p><p class="hint">自动保存到 <span class="path">__IMAGE_OUTPUT__</span>。提交后即使关闭网页，后台也会继续生成和保存。</p></section>
<section><div class="history-top"><h2>生成记录</h2><div class="history-tools"><button id="undo-delete" class="secondary" hidden>撤销本次删除</button><button id="clear-records" class="danger" disabled>清空记录</button></div></div><p class="hint">仅删除生成记录，已保存的图片文件保留。正在生成的任务不会删除。</p><p id="record-status" role="status"></p><div id="results"></div></section></main>
<script>
const token='__TOKEN__';let refs=[],busy=false,uploading=0,activeJob=null,recordReady=false,recordBusy=false,lastDeleted=[];const $=id=>document.getElementById(id);const labels={running:'正在排队或生成…',done:'已保存',failed:'生成失败',uncertain:'提交未确认',submitting:'正在提交'};
async function api(path,body){const r=await fetch(path,{method:'POST',headers:{'X-Manual-Token':token,...(body instanceof FormData?{}:{'Content-Type':'application/json'})},body:body instanceof FormData?body:JSON.stringify(body)});const d=await r.json();if(!r.ok)throw Error(d.error||'请求失败');return d}
function drawRefs(){$('refs').replaceChildren();refs.forEach((r,i)=>{const card=document.createElement('div');card.className='ref';const img=document.createElement('img');img.src=r.preview;const label=document.createElement('span');label.textContent=`图${i+1}`;card.append(img,label);for(const [text,action] of [['←',()=>{if(i>0)[refs[i-1],refs[i]]=[refs[i],refs[i-1]]}],['→',()=>{if(i<refs.length-1)[refs[i+1],refs[i]]=[refs[i],refs[i+1]]}],['移除',()=>{URL.revokeObjectURL(r.preview);refs.splice(i,1)}]]){const b=document.createElement('button');b.textContent=text;b.className='secondary';b.onclick=()=>{action();drawRefs()};card.append(b)}$('refs').append(card)})}
async function addFiles(files){if(refs.length+uploading+files.length>16){$('error').textContent='最多支持16张参考图';return}uploading+=files.length;$('generate').disabled=true;try{for(const file of files){if(!['image/png','image/jpeg','image/webp'].includes(file.type))throw Error('请使用PNG、JPG或WebP图片');if(file.size>24_000_000)throw Error('单张图片需小于24MB');$('status').textContent='正在上传 '+file.name;const form=new FormData();form.append('image',file,'manual-'+crypto.randomUUID()+'.'+(file.type==='image/jpeg'?'jpg':file.type.split('/')[1]));form.append('subfolder','manual-portal');form.append('overwrite','false');const result=await api('/api/upload',form);refs.push({name:result.name,preview:URL.createObjectURL(file)});drawRefs()}}catch(e){$('error').textContent=e.message}finally{uploading-=files.length;$('status').textContent='';$('generate').disabled=busy||uploading>0;$('files').value=''}}
$('files').onchange=()=>addFiles([...$('files').files]);for(const event of ['dragover','dragleave','drop'])$('drop').addEventListener(event,e=>{e.preventDefault();$('drop').classList.toggle('over',event==='dragover');if(event==='drop')addFiles([...e.dataTransfer.files])});
$('generate').onclick=async()=>{if(busy||uploading)return;busy=true;$('generate').disabled=true;$('error').textContent='';$('status').textContent='正在提交…';try{const j=await api('/api/generate',{prompt:$('prompt').value,images:refs.map(r=>r.name),steps:Number($('steps').value),resolution:Number($('resolution').value),seed:Number($('seed').value)});activeJob=j.id;$('status').textContent=labels[j.state];if(j.error)$('error').textContent=j.error;await refresh()}catch(e){$('error').textContent=e.message;$('status').textContent=''}finally{busy=false;$('generate').disabled=uploading>0}};
function recordButtons(){ $('clear-records').disabled=!recordReady||recordBusy;$('undo-delete').hidden=!lastDeleted.length;$('undo-delete').disabled=recordBusy;document.querySelectorAll('[data-delete-record]').forEach(b=>{b.disabled=!recordReady||recordBusy}) }
async function deleteRecords(id=null){
 if(!recordReady||recordBusy)return;
 if(!confirm(id?'删除这条生成记录？已保存的图片会保留。':'清空所有已结束的生成记录？图片文件保留，正在生成的任务不会删除。'))return;
 recordBusy=true;recordButtons();
 try{const result=await api('/api/records',id?{action:'delete',ids:[id]}:{action:'delete',all_finished:true});lastDeleted=result.ids;$('record-status').textContent=`已删除 ${result.changed} 条记录，图片已保留。`+(result.skipped?`跳过 ${result.skipped} 条正在处理的任务。`:'');await refresh()}
 catch(e){$('record-status').textContent='删除未完成：'+e.message}
 finally{recordBusy=false;recordButtons()}
}
async function undoDelete(){
 if(recordBusy||!lastDeleted.length)return;recordBusy=true;recordButtons();let restored=0;
 try{while(lastDeleted.length){const ids=lastDeleted.slice(0,500);const result=await api('/api/records',{action:'restore',ids});restored+=result.changed;lastDeleted=lastDeleted.slice(ids.length)}$('record-status').textContent=`已恢复 ${restored} 条记录。`;await refresh()}
 catch(e){$('record-status').textContent='恢复未完成：'+e.message}
 finally{recordBusy=false;recordButtons()}
}
$('clear-records').onclick=()=>deleteRecords();$('undo-delete').onclick=undoDelete;
async function refresh(){try{
 const r=await fetch('/api/jobs');if(!r.ok)throw Error('无法读取生成记录');const d=await r.json();recordReady=d.record_delete_version===1;
 if(!recordReady)$('record-status').textContent='删除功能等待网页服务加载更新；现有生图不受影响。';
 $('results').replaceChildren();if(!d.jobs.length)$('results').textContent='还没有生成记录。';
 for(const j of d.jobs){
  if(j.id===activeJob)$('status').textContent=labels[j.state]||j.state;
  const card=document.createElement('article');card.className='result';const top=document.createElement('div');top.className='result-top';const title=document.createElement('strong');title.textContent=labels[j.state]||j.state;top.append(title);
  if(['done','failed','uncertain'].includes(j.state)){const remove=document.createElement('button');remove.className='danger';remove.textContent='删除记录';remove.setAttribute('data-delete-record',j.id);remove.setAttribute('aria-label','删除这条生成记录，保留图片');remove.onclick=()=>deleteRecords(j.id);top.append(remove)}
  const p=document.createElement('p');p.textContent=j.prompt;const meta=document.createElement('p');meta.textContent=`参考图 ${j.references} 张 · 种子 ${j.seed}`;card.append(top,p,meta);
  for(const f of j.files||[]){const a=document.createElement('a');a.href='/image/'+encodeURIComponent(f);a.target='_blank';const img=document.createElement('img');img.src=a.href;img.loading='lazy';a.append(img);const name=document.createElement('p');name.textContent=f;card.append(a,name)}
  if(j.error||j.poll_error){const e=document.createElement('p');e.className='error';e.textContent=j.error||('等待恢复：'+j.poll_error);card.append(e)}$('results').append(card)
 }
 recordButtons();
}catch(e){$('error').textContent='本地服务连接失败：'+e.message}}

refresh();setInterval(refresh,3000);
</script></html>

<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4f7fb">
<title>鲸聊</title>
<style>
  :root {
    --green: #3678df;
    --green-dark: #2864c2;
    --bubble-me: #dfeeff;
    --bubble-other: #ffffff;
    --bg: #f4f7fb;
    --bar: #f7f7f7;
    --ink: #191919;
    --ink-2: #8a8a8a;
    --line: rgba(0, 0, 0, 0.08);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--ink);
    overflow: hidden;
    user-select: none;
  }

  /* ── 顶部栏 ─────────────────────────────── */
  .topbar {
    position: fixed; top: 0; left: 0; right: 0; z-index: 10;
    height: calc(48px + env(safe-area-inset-top));
    padding-top: env(safe-area-inset-top);
    background: var(--bar);
    border-bottom: 0.5px solid var(--line);
    display: flex; align-items: center; justify-content: center;
  }
  .topbar .title {
    font-size: 17px; font-weight: 600; color: var(--ink);
    max-width: 60%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .topbar .scan {
    position: absolute; right: 8px;
    top: calc(env(safe-area-inset-top) + 4px);
    width: 40px; height: 40px; border: none; background: transparent;
    display: flex; align-items: center; justify-content: center; cursor: pointer;
  }
  .topbar .scan svg { width: 22px; height: 22px; color: var(--ink); }
  /* ── 消息区 ─────────────────────────────── */
  .msgs {
    position: fixed; top: calc(48px + env(safe-area-inset-top));
    bottom: calc(56px + env(safe-area-inset-bottom));
    left: 0; right: 0; overflow-y: auto; padding: 12px 12px 8px;
    -webkit-overflow-scrolling: touch;
  }
  .row { display: flex; margin-bottom: 14px; align-items: flex-start; }
  .row.me { flex-direction: row-reverse; }
  .avatar {
    width: 40px; height: 40px; border-radius: 6px; flex: none;
    background: #d9d9d9 center/cover no-repeat;
  }
  .bubble {
    position: relative; max-width: 72%;
    margin: 0 10px;
    padding: 9px 12px;
    font-size: 15px; line-height: 1.45;
    word-break: break-word; white-space: pre-wrap;
    border-radius: 8px;
  }
  .row.other .bubble { background: var(--bubble-other); }
  .row.me .bubble { background: var(--bubble-me); }
  .row.other .bubble::before, .row.me .bubble::before {
    content: ""; position: absolute; top: 14px; width: 10px; height: 10px;
    transform: rotate(45deg); z-index: -1;
  }
  .row.other .bubble::before { left: -4px; background: var(--bubble-other); }
  .row.me .bubble::before { right: -4px; background: var(--bubble-me); }
  .status .bubble {
    display: flex; align-items: center; gap: 8px;
    color: var(--ink-2); font-size: 14px; background: var(--bubble-other);
  }

  /* ── 语音条（微信样式）─────────────────── */
  .vwrap { max-width: 72%; margin: 0 10px; display: flex; flex-direction: column; gap: 6px; }
  .row.me .vwrap { align-items: flex-end; }
  .vbubble {
    position: relative; display: inline-flex; align-items: center; gap: 7px;
    min-width: 74px; padding: 10px 13px; border-radius: 6px;
    cursor: pointer; user-select: none; -webkit-tap-highlight-color: transparent;
  }
  .row.other .vbubble { background: var(--bubble-other); }
  .row.me .vbubble { background: var(--bubble-me); }
  .vbubble::after {
    content: ""; position: absolute; top: 15px; width: 9px; height: 9px;
    transform: rotate(45deg); z-index: -1;
  }
  .row.me .vbubble::after { right: -4px; background: var(--bubble-me); }
  .row.other .vbubble::after { left: -4px; background: var(--bubble-other); }
  .vbubble .vb-dur { font-size: 13px; color: #4a4a4a; font-variant-numeric: tabular-nums; }
  .vbubble .vb-sound { width: 19px; height: 19px; color: #333; flex: none; }
  .vbubble .vb-sound .arc { opacity: .35; }
  .vbubble.playing .vb-sound .arc { animation: vbArc .9s infinite ease-in-out; opacity: 1; }
  .vbubble.playing .vb-sound .arc2 { animation-delay: .18s; }
  .vbubble.playing .vb-sound .arc3 { animation-delay: .36s; }
  .vbubble.loading { opacity: .55; }
  @keyframes vbArc { 0%,100% { opacity: .25; } 50% { opacity: 1; } }
  .vstatus { font-size: 11px; color: #a0a0a0; }
  .vstatus.err { color: #d0392b; }
  .vtext {
    font-size: 15px; line-height: 1.5; color: #191919; white-space: pre-wrap; word-break: break-word;
    background: #fff; border: 1px solid #e8e8e8; border-radius: 8px; padding: 9px 12px;
    max-width: 100%;
  }
  .vtext[hidden] { display: none; }

  /* ── 语音条操作菜单 ─────────────────────── */
  #voiceSheetMask {
    position: fixed; inset: 0; background: rgba(0,0,0,.35); display: none; z-index: 60;
  }
  #voiceSheetMask.show { display: block; }
  #voiceSheet {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 61; background: #f7f7f7;
    border-radius: 12px 12px 0 0; padding: 8px; display: none;
  }
  #voiceSheet.show { display: block; }
  #voiceSheet button {
    display: block; width: 100%; height: 50px; margin: 0 0 6px; border: 0; border-radius: 9px;
    background: #fff; font-size: 16px; color: #191919;
  }
  #voiceSheet button.cancel { background: #ededed; margin-bottom: 0; }
  #voiceSheet button.danger { color: #d0392b; }

  /* ── 文字消息操作菜单（长按气泡：复制 / 多选） ─────── */
  #textSheetMask {
    position: fixed; inset: 0; background: rgba(0,0,0,.35); display: none; z-index: 60;
  }
  #textSheetMask.show { display: block; }
  #textSheet {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 61; background: #f7f7f7;
    border-radius: 12px 12px 0 0; padding: 8px; display: none;
  }
  #textSheet.show { display: block; }
  #textSheet button {
    display: block; width: 100%; height: 50px; margin: 0 0 6px; border: 0; border-radius: 9px;
    background: #fff; font-size: 16px; color: #191919;
  }
  #textSheet button.cancel { background: #ededed; margin-bottom: 0; }
  .dots { display: inline-flex; gap: 4px; align-items: center; }
  .dots i {
    width: 6px; height: 6px; border-radius: 50%; background: #b8b8b8;
    animation: bounce 1.2s infinite;
  }
  .dots i:nth-child(2) { animation-delay: .2s; }
  .dots i:nth-child(3) { animation-delay: .4s; }
  @keyframes bounce { 0%, 60%, 100% { transform: translateY(0); opacity: .5; } 30% { transform: translateY(-5px); opacity: 1; } }

  .toast {
    position: fixed; top: calc(56px + env(safe-area-inset-top)); left: 50%;
    transform: translateX(-50%); z-index: 30;
    background: rgba(0,0,0,.72); color: #fff; font-size: 13px;
    padding: 7px 14px; border-radius: 6px; opacity: 0;
    transition: opacity .25s; pointer-events: none; max-width: 80%;
  }
  .toast.show { opacity: 1; }

  /* ── 语音识别中提示 ─────────────────────── */
  /* ── 录音浮层（微信样式）────────────────── */
  .voice-hint {
    position: fixed; inset: 0; z-index: 55;
    display: none; flex-direction: column; align-items: center; justify-content: center;
    pointer-events: none;
  }
  .voice-hint.show { display: flex; background: rgba(0,0,0,.16); }
  .voice-hint .vh-state {
    margin-bottom: 16px; padding: 7px 18px; border-radius: 20px;
    background: rgba(0,0,0,.72); color: #fff; font-size: 14px; line-height: 1.2;
  }
  .voice-hint .mic {
    position: relative; width: 152px; height: 152px; border-radius: 20px;
    background: rgba(0,0,0,.66);
    display: flex; align-items: center; justify-content: center;
    transition: background .15s;
  }
  .voice-hint .mic svg { width: 44px; height: 44px; color: #fff; }
  .voice-hint .waves {
    position: absolute; bottom: 20px; left: 0; right: 0;
    display: flex; align-items: flex-end; justify-content: center; gap: 4px; height: 20px;
  }
  .voice-hint .waves i {
    width: 4px; height: 6px; border-radius: 2px; background: rgba(255,255,255,.9);
    animation: vhwave .9s infinite ease-in-out;
  }
  .voice-hint .waves i:nth-child(2) { animation-delay: .1s; }
  .voice-hint .waves i:nth-child(3) { animation-delay: .2s; }
  .voice-hint .waves i:nth-child(4) { animation-delay: .3s; }
  .voice-hint .waves i:nth-child(5) { animation-delay: .4s; }
  .voice-hint .waves i:nth-child(6) { animation-delay: .5s; }
  @keyframes vhwave { 0%,100% { height: 6px; } 50% { height: 18px; } }
  .voice-hint .vh-tip {
    margin-top: 20px; padding: 6px 15px; border-radius: 18px;
    background: rgba(0,0,0,.66);
    display: flex; align-items: center; gap: 5px;
    font-size: 13px; color: #fff;
  }
  .voice-hint .vh-tip svg { width: 15px; height: 15px; color: #fff; }
  /* 取消区：浮层变红并提示松手取消 */
  .voice-hint.cancelling .mic { background: rgba(214,60,50,.94); }
  .voice-hint.cancelling .vh-state { background: rgba(214,60,50,.94); }
  .voice-hint.cancelling .vh-tip { background: rgba(214,60,50,.94); color: #fff; }
  .voice-hint.cancelling .vh-tip svg { color: #fff; }
  .voice-hint .text { display: none; }

  /* ── 头像菜单（底部弹层） ───────────────── */
  .avatar-mask { position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 60; display: none; }
  .avatar-mask.show { display: block; }
  .avatar-menu { position: fixed; left: 0; right: 0; bottom: 0; background: #fff;
    border-radius: 14px 14px 0 0; z-index: 61; display: none; padding: 8px 0; }
  .avatar-menu.show { display: block; }
  .avatar-menu .item { height: 52px; line-height: 52px; text-align: center; font-size: 16px;
    color: #191919; cursor: pointer; }
  .avatar-menu .item.cancel { border-top: 6px solid #f2f2f2; color: #8a8a8a; }
  .avatar { cursor: pointer; }

  /* ── 修改昵称弹层 ─────────────────────── */
  .nick-mask { position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 70; display: none; }
  .nick-mask.show { display: block; }
  .nick-dialog { position: fixed; left: 28px; right: 28px; top: 28%; background: #fff; border-radius: 12px;
    z-index: 71; padding: 18px 16px; display: none; }
  .nick-dialog.show { display: block; }
  .nick-title { font-size: 16px; font-weight: 600; text-align: center; margin-bottom: 14px; }
  .nick-dialog input { width: 100%; height: 42px; border: 1px solid #e5e5e5; border-radius: 8px;
    font-size: 16px; padding: 0 12px; outline: none; box-sizing: border-box; }
  .nick-btns { display: flex; gap: 10px; margin-top: 14px; }
  .nick-btns button { flex: 1; height: 40px; border: none; border-radius: 8px; font-size: 15px; cursor: pointer; }
  .nick-btns .cancel { background: #f2f2f2; color: #191919; }
  .nick-btns .ok { background: #07c160; color: #fff; }
  .topbar .title { cursor: pointer; }

  /* ── 多选删除 ───────────────────────────── */
  .select-bar { position: fixed; top: 0; left: 0; right: 0; z-index: 50; height: calc(48px + env(safe-area-inset-top));
    padding-top: env(safe-area-inset-top); background: var(--bar); border-bottom: 0.5px solid var(--line);
    display: none; align-items: center; padding-left: 12px; padding-right: 12px; gap: 16px; }
  .select-bar.show { display: flex; }
  .select-bar button { border: none; background: transparent; font-size: 15px; color: #191919; cursor: pointer; padding: 4px; }
  .select-bar .danger { color: #d0392b; }
  .select-bar .title { flex: 1; text-align: center; font-size: 15px; color: #191919; }
  .check { width: 22px; height: 22px; min-width: 22px; border-radius: 50%; border: 1.5px solid #c0c0c0;
    align-self: center; margin: 0 8px 0 0; display: flex; align-items: center; justify-content: center; }
  .row.selected .check { background: #07c160; border-color: #07c160; }
  .row.selected .check::after { content: ""; width: 10px; height: 5px; border-left: 2px solid #fff;
    border-bottom: 2px solid #fff; transform: rotate(-45deg) translateY(-1px); }
  .row.selected { background: rgba(7, 193, 96, 0.08); border-radius: 8px; }

  /* ── 底部输入条 ─────────────────────────── */
  .inputbar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;
    background: var(--bar); border-top: 0.5px solid var(--line);
    padding: 8px 10px calc(8px + env(safe-area-inset-bottom));
    display: flex; align-items: flex-end; gap: 8px;
  }
  .inputbar .voice-btn {
    width: 38px; height: 40px; flex: none; border: none; background: transparent;
    display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0;
  }
  .inputbar .voice-btn svg { width: 26px; height: 26px; color: #191919; }
  .inputbar .voice-btn .icon-keyboard { display: none; }
  .inputbar .voice-btn.voice-mode .icon-mic { display: none; }
  .inputbar .voice-btn.voice-mode .icon-keyboard { display: block; }
  .inputbar .field {
    flex: 1; min-height: 40px; max-height: 120px; border: none; outline: none;
    background: #f2f2f2; border-radius: 8px; font-size: 16px; line-height: 22px;
    padding: 9px 12px; color: var(--ink); user-select: text; -webkit-user-select: text;
    resize: none; overflow-y: auto; font-family: inherit;
  }
  .inputbar .send {
    height: 40px; min-width: 68px; border: none; border-radius: 8px;
    background: var(--green); color: #fff; font-size: 16px; font-weight: 500;
    cursor: pointer; padding: 0 14px; flex: none;
  }
  .inputbar .send:disabled { background: #d0d0d0; }
  /* 语音面板：点击唤起系统语音识别 */
  .inputbar .holdtalk {
    flex: 1; height: 40px; border: none; border-radius: 8px; background: #f2f2f2;
    color: #191919; font-size: 16px; display: none; align-items: center; justify-content: center;
    cursor: pointer; user-select: none; -webkit-user-select: none;
  }
  .inputbar .holdtalk.show { display: flex; }
  .inputbar .holdtalk.recording { background: #dcdcdc; color: #555; }

  /* ── 未配对引导页（默认可见，不依赖 JS，杜绝白屏） ── */
  .guide { position: fixed; inset: 0; background: var(--bg); display: flex;
    flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 24px; z-index: 40; }
  .guide.hidden { display: none; }
  .guide .logo { width: 84px; height: 84px; border-radius: 20px; background: var(--green);
    display: flex; align-items: center; justify-content: center; }
  .guide .logo svg { width: 46px; height: 46px; color: #fff; }
  .guide h1 { font-size: 19px; font-weight: 600; }
  .guide p { font-size: 14px; color: var(--ink-2); text-align: center; line-height: 1.6; }
  .guide .btn {
    width: 220px; height: 46px; border: none; border-radius: 10px;
    background: var(--green); color: #fff; font-size: 16px; font-weight: 600; cursor: pointer;
  }
  .guide .btn:active { background: var(--green-dark); }
  .guide .divider { display: flex; align-items: center; gap: 10px; width: 260px; color: var(--ink-2); font-size: 12px; }
  .guide .divider::before, .guide .divider::after { content: ""; flex: 1; height: 0.5px; background: var(--line); }
  .guide .paste { display: flex; gap: 8px; width: 260px; }
  .guide .paste input { flex: 1; height: 40px; border: none; outline: none; background: #fff;
    border-radius: 8px; font-size: 14px; padding: 0 10px; color: var(--ink); user-select: text; -webkit-user-select: text; }
  .guide .paste button { height: 40px; padding: 0 14px; border: none; border-radius: 8px;
    background: var(--green); color: #fff; font-size: 14px; cursor: pointer; }
  .guide .hint { font-size: 12px; color: #b0b0b0; }

  .manager-overlay {position:fixed;inset:0;z-index:75;background:#11151c;display:flex;flex-direction:column;}
  .manager-top {height:calc(54px + env(safe-area-inset-top));padding:env(safe-area-inset-top) 12px 0;display:flex;align-items:center;justify-content:space-between;color:#d7e5fc;background:#1b2330;}
  .manager-top button {height:42px;border:0;background:transparent;color:#a9c9ff;font-size:14px;}
  #managerFrame {width:100%;flex:1;border:0;background:#11151c;}
  /* Whale mobile UI v2 — quiet blue, shared touch targets and sheets. */
  :root { --bar:rgba(255,255,255,.96); --ink:#243044; --ink-2:#7e8ba0; }
  button { font-family:inherit; touch-action:manipulation; }
  button:focus-visible,[role=button]:focus-visible { outline:3px solid #95baf4;outline-offset:3px; }
  button:disabled { opacity:.48; }
  [hidden] { display:none!important; }
  .topbar { height:calc(60px + env(safe-area-inset-top));box-shadow:0 1px 12px #253d5910;border:0; }
  .topbar .title { font-size:17px;max-width:calc(100% - 140px);letter-spacing:.3px; }
  .topbar .scan,.topbar .manager-btn { position:absolute;top:calc(env(safe-area-inset-top) + 8px);width:44px;height:44px;border:0;border-radius:14px;background:transparent;color:#536783;display:flex;align-items:center;justify-content:center; }
  .topbar .manager-btn { left:10px;background:#eef4ff;color:#376fc4; }
  .topbar .manager-btn svg,.topbar .scan svg { width:23px;height:23px; }
  .topbar .scan { right:10px; }
  .msgs { top:calc(60px + env(safe-area-inset-top));padding:20px 14px 12px;scroll-behavior:auto; }
  .row { margin-bottom:18px;gap:0; }
  .avatar { width:36px;height:36px;border-radius:12px;box-shadow:0 1px 4px #20395a12; }
  .bubble { max-width:calc(100% - 68px);margin:0 10px;padding:11px 14px;font-size:15.5px;line-height:1.65;border-radius:17px;box-shadow:0 2px 8px #1e365006;touch-action:pan-y pinch-zoom; }
  .row.other .bubble { border-top-left-radius:5px; }
  .row.me .bubble { border-top-right-radius:5px; }
  .bubble::before,.vbubble::after { display:none; }
  .bubble.media-bubble { padding:5px;overflow:hidden; }
  .bubble.media-bubble img { display:block;border-radius:13px;max-width:100%;max-height:360px;cursor:zoom-in; }
  .inputbar { background:var(--bar);gap:9px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));box-shadow:0 -3px 16px #1e365005;border-color:#e6ecf3; }
  .inputbar .field { border-radius:15px;background:#f0f4f9;min-height:44px;padding:11px 13px;font-size:16px; }
  .inputbar .voice-btn,.inputbar .send { height:44px;border-radius:14px; }
  .inputbar .voice-btn { width:38px; }
  .inputbar .voice-btn svg { width:25px;height:25px;color:#526782; }
  .inputbar .send { min-width:62px;font-size:14px; }
  .inputbar .send:disabled { background:#dfe6ef;color:#8d9aab;opacity:1; }
  .inputbar .holdtalk { height:44px;border-radius:15px;background:#eff4fa; }
  .select-bar { height:calc(60px + env(safe-area-inset-top)); }
  .vwrap { max-width:calc(100% - 68px);min-width:140px;gap:7px; }
  .vbubble { border:0;border-radius:17px;min-height:48px;min-width:152px;padding:11px 15px;display:flex;gap:15px;color:#42658c;box-shadow:0 2px 8px #1e365008;touch-action:pan-y; }
  .row.other .vbubble { border-top-left-radius:5px; }
  .row.me .vbubble { border-top-right-radius:5px; }
  .vb-dur { font-family:inherit!important;flex:1;text-align:left;font-size:14px!important; }
  .vb-sound { color:#42658c!important; }
  .vbubble.playing { background:#e5efff; }
  .vbubble.playing .vb-dur { color:#2d6ac4; }
  .vtext { border:0;background:#fff;border-radius:13px;font-size:14px;padding:12px;user-select:none;-webkit-user-select:none; }
  .voice-caption { align-self:flex-start;padding:2px 3px;border:0;background:transparent;color:#6b82a1;font-size:12px; }
  .vstatus { max-width:240px;line-height:1.4;color:#8795a9; }
  #voiceSheet,#textSheet,.avatar-menu { left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom));border-radius:23px;padding:12px;background:#f5f8fc;box-shadow:0 10px 50px #152a4d24;max-height:80dvh;overflow:auto; }
  #voiceSheet button,#textSheet button,.avatar-menu .item { border:0;display:block;width:100%;min-height:48px;height:auto;line-height:1.4;padding:14px;border-radius:13px;margin:4px 0;background:#fff;font-size:15px;color:#304561; }
  #voiceSheet button.cancel,#textSheet button.cancel,.avatar-menu .item.cancel { background:#e8edf5;border:0;margin-top:10px;color:#7b8ba1; }
  .avatar-mask,#voiceSheetMask,#textSheetMask,.nick-mask { background:#14284755;backdrop-filter:blur(3px); }
  .sheet-heading { font-size:14px;font-weight:600;text-align:center;padding:5px 0 10px;color:#526783; }
  .avatar-preview { width:64px;height:64px;border-radius:21px;background:#e3ebf5 center/cover;margin:0 auto 12px; }
  .sheet-note { color:#8591a3;font-size:12px;line-height:1.6;margin:9px 0; }
  .nick-dialog { border-radius:22px;padding:22px;box-shadow:0 12px 60px #172a4426; }
  .selection-dialog { position:fixed;z-index:71;left:12px;right:12px;top:15%;max-height:70dvh;padding:20px;background:white;border-radius:22px;overflow:auto; }
  .selection-heading { display:flex;justify-content:space-between;align-items:center; }

<body>
  <div id="networkNotice" hidden role="status" style="position:fixed;top:64px;left:12px;right:12px;z-index:120;background:#fff3d6;color:#785a16;padding:10px 14px;border-radius:12px;font-size:14px;box-shadow:0 2px 10px #0001"><span id="networkMessage">连接中断，正在重试，配对信息已保留。</span><button id="networkRetry" style="float:right;border:0;background:transparent;color:#2469c7">重试</button></div>

  <header class="topbar" id="topbar" style="display:none">

        <rect x="3" y="14" width="7" height="7" rx="1.5"/><path d="M14 14h3v3h-3zM21 14v.01M17 21h.01M21 21h.01"/>
      </svg>
    </button>
    <button class="manager-btn" id="assistantManagerBtn" aria-label="打开管理台" title="管理台"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/></svg></button>
    <span class="title" id="titleText" role="button" tabindex="0" aria-label="修改聊天名称">大肥鱼</span>

  <header class="select-bar" id="selectBar">
    <button id="selectCancelBtn">取消</button>

  <main class="msgs" id="msgs"></main>

  <footer class="inputbar" id="inputbar" style="display:none">
    <button class="voice-btn" id="voiceBtn" aria-label="语音输入" title="语音输入">
      <svg class="icon-mic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="9" y="2" width="6" height="11" rx="3"/><path d="M5 10v1a7 7 0 0 0 14 0v-1"/><path d="M12 18v4"/>
      </svg>
      <svg class="icon-keyboard" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="2" y="6" width="20" height="12" rx="2"/>
        <path d="M6 10h.01M10 10h.01M14 10h.01M18 10h.01M6 14h.01M18 14h.01M9 14h6"/>
      </svg>

    <button class="holdtalk" id="holdTalk">按住 说话</button>
    <button class="send" id="sendBtn" disabled>发送</button>
    <button class="attach-btn" id="attachBtn" aria-label="上传图片或文件" title="上传图片或文件">＋</button>
  </footer>

  <button id="latestBtn" class="latest-btn" hidden>↓ 回到最新</button>
  <div class="nick-mask" id="selectionMask"></div><section class="selection-dialog" id="selectionDialog" role="dialog" aria-modal="true" aria-label="选择消息文字" hidden>
    <div class="selection-heading"><b>选择文字</b><button id="selectionClose">完成</button></div><p class="sheet-note">长按下面的文字，拖动系统选择柄，再复制需要的部分。</p><div id="selectionText" tabindex="0"></div>
  </section>
  <div class="image-viewer" id="imageViewer" role="dialog" aria-modal="true" aria-label="查看图片" hidden><button id="imageClose" aria-label="关闭图片">×</button><img id="imagePreview" alt="消息图片"></div>
  <section id="managerOverlay" class="manager-overlay" hidden role="dialog" aria-modal="true" aria-label="管理台"><div class="manager-top"><button id="managerBack">‹ 返回聊天</button><span>管理台</span><button id="managerReload" aria-label="刷新管理台">↻</button></div><iframe id="managerFrame" title="手机管理台"></iframe></section>
  <input id="appearanceFile" type="file" accept="image/*" hidden>
  <section id="uploadOverlay" class="upload-overlay" role="dialog" aria-modal="true" aria-label="发送附件" hidden><div class="upload-sheet"><div class="upload-head"><b>发送附件</b><button id="uploadClose">关闭</button></div><div class="upload-options"><button id="pickImages">选择图片</button><button id="pickFiles">选择文件</button></div><div class="upload-help">每次最多6个文件。图片不超过10MiB，其他文件不超过32MiB。支持图片、视频、音频和PDF、DOCX、文本等资料；其他格式只保存，不执行。</div><div id="uploadList"></div><div id="uploadStatus" class="upload-help" role="status"></div><button id="uploadConfirm" class="upload-confirm" disabled>上传并发送</button></div></section>
  <input id="messageImages" type="file" accept="image/*" multiple hidden>
  <input id="messageFiles" type="file" multiple hidden>

  <div class="toast" id="toast"></div>

  <div class="voice-hint" id="voiceHint">
    <div class="vh-state" id="voiceHintLabel">松开 发送</div>
    <div class="mic">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="9" y="2" width="6" height="11" rx="3"/><path d="M5 10v1a7 7 0 0 0 14 0v-1"/><path d="M12 18v4"/>
      </svg>
      <div class="waves"><i></i><i></i><i></i><i></i><i></i><i></i></div>
    </div>
    <div class="vh-tip" id="voiceCancelHint">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 19V5"/><path d="M5 12l7-7 7 7"/>
      </svg>
      <span id="voiceCancelHintText">上滑取消</span>
    </div>
    <div class="text" id="voiceHintText"></div>
  </div>

  <div class="avatar-mask" id="avatarMask"></div>
  <div class="avatar-menu" id="avatarMenu" role="dialog" aria-modal="true" aria-label="头像与聊天外观">
    <div class="sheet-heading" id="avatarHeading">聊天外观</div><div class="avatar-preview" id="avatarPreview"></div>
    <button class="item" id="avatarChangeItem">更换头像</button>
    <button class="item" id="backgroundChangeItem">更换聊天背景</button>
    <button class="item" id="backgroundDeleteItem">恢复默认背景</button>
    <button class="item cancel" id="avatarCancelItem">取消</button>
  </div>

  <div id="voiceSheetMask"></div>
  <div id="voiceSheet">
    <button id="voiceTextBtn">转文字</button>
    <button id="voiceDeleteBtn">多选消息</button>
    <button id="voiceCancelBtn" class="cancel">取消</button>
  </div>

  <div id="textSheetMask"></div>
  <div id="textSheet">
    <button id="textCopyBtn">复制文字</button>
    <button id="textRangeBtn">选择部分文字</button>
    <button id="textSelectBtn">多选消息</button>
    <button id="textSheetCancel" class="cancel">取消</button>
  </div>

  <div class="nick-mask" id="nickMask"></div>  <div class="nick-dialog" id="nickDialog">
    <div class="nick-title">修改聊天对象名</div>
    <input id="nickInput" type="text" maxlength="30" placeholder="请输入名称">
    <div class="nick-btns">
      <button class="cancel" id="nickCancelBtn">取消</button>
      <button class="ok" id="nickOkBtn">确定</button>
    </div>
  </div>

  <section class="guide" id="guide">
    <div class="logo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/>
      </svg>
    </div>
    <h1>连接电脑上的鲸聊</h1>
    <p>先扫码配对电脑，配对后即可像微信一样<br>给电脑上的智能体发消息</p>
    <button class="btn" id="guideScanBtn">扫一扫连接</button>
    <div class="divider">或粘贴配对链接</div>
    <div class="paste">
      <input id="pasteInput" type="text" placeholder="http://…/wechat?pair=…">
      <button id="pasteBtn">连接</button>
    </div>
    <p class="hint">电脑端：打开「鲸聊 · 配对」面板生成二维码</p>
  </section>

<script>
window.__WECHAT_DEVICE__ = __WECHAT_DEVICE_VALUE__;
window.__WECHAT_PAIR_ERR__ = __WECHAT_PAIR_ERR_VALUE__;
window.__WECHAT_CLIENT__ = __WECHAT_CLIENT_VALUE__;
(function () {
  'use strict';

  // 元素引用先声明：下面初始化逻辑会立即调用 showChat/showGuide，不能引用未赋值的变量
  var cfg = { nickname: '大肥鱼', avatarOther: '', avatarMe: '' };
  var msgs = document.getElementById('msgs');
  var input = document.getElementById('input');
  var sendBtn = document.getElementById('sendBtn');
  var voiceBtn = document.getElementById('voiceBtn');
  var holdTalk = document.getElementById('holdTalk');
  var toast = document.getElementById('toast');
  var guide = document.getElementById('guide');
  var avatarMask = document.getElementById('avatarMask');
  var avatarMenu = document.getElementById('avatarMenu');
  var avatarMenuSide = 'other';
  var titleText = document.getElementById('titleText');
  var nickMask = document.getElementById('nickMask');
  var nickDialog = document.getElementById('nickDialog');
  var nickInput = document.getElementById('nickInput');
  var statusRow = null;
  var busy = false;
  var knownIds = {};
  var lastSeq = 0;
  var pollTimer = null;
  var seenMsgIds = {};
  var hiddenSet = {};
  var selectMode = false;
  var selectedIds = {};
  var chatShown = false;
  var selectBar = document.getElementById('selectBar');
  var selectCount = document.getElementById('selectCount');
  var deleteBtn = document.getElementById('deleteBtn');

  var qs = new URLSearchParams(location.search);
  var deviceId = (window.__WECHAT_DEVICE__) || qs.get('device') || (function () {
    try { return sessionStorage.getItem('dsh-remote-device') || localStorage.getItem('dsh-remote-device'); } catch (e) { return null; }
  })();
  // 稳定客户端标识：App 注入优先，其次本地持久化；用于跨扫码/换公网地址保留同一会话
  var clientId = (window.__WECHAT_CLIENT__) || qs.get('client') || (function () {
    try { return localStorage.getItem('dsh-wechat-client'); } catch (e) { return null; }
  })() || (function () {
    var id = (Math.random() + 1).toString(36).slice(2) + Date.now().toString(36);
    try { localStorage.setItem('dsh-wechat-client', id); } catch (e) {}
    return id;
  })();
  try { localStorage.setItem('dsh-wechat-client', clientId); } catch (e) {}
  // 落库 deviceId，并清掉地址栏里的配对参数
  if (deviceId) {
    try {
      sessionStorage.setItem('dsh-remote-device', deviceId);
      localStorage.setItem('dsh-remote-device', deviceId);
    } catch (e) {}
  }
  if (qs.get('pair') || qs.get('device') || qs.get('client')) {
    try { history.replaceState(null, '', location.pathname); } catch (e) {}
  }
  // 配对失败提示（服务器直接下发到页面）
  if (window.__WECHAT_PAIR_ERR__) {
    setTimeout(function () { toastText('配对失败：请刷新电脑上的二维码后重扫'); }, 250);
  }
  // 有设备凭据就先显示聊天骨架，不依赖网络请求才渲染
  if (deviceId) showChat();

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function toastText(t) {
    toast.textContent = t; toast.classList.add('show');
    clearTimeout(toastText._t);
    toastText._t = setTimeout(function () { toast.classList.remove('show'); }, 2600);
  }
  var followLatest=true;
  function scrollBottom(force) { if(force===true||followLatest){msgs.scrollTop=msgs.scrollHeight;document.getElementById('latestBtn').hidden=true;}else document.getElementById('latestBtn').hidden=false; }
  msgs.addEventListener('scroll',function(){followLatest=msgs.scrollHeight-msgs.scrollTop-msgs.clientHeight<100;document.getElementById('latestBtn').hidden=followLatest;},{passive:true});
  document.getElementById('latestBtn').addEventListener('click',function(){followLatest=true;scrollBottom(true);});

  function addRow(kind, text, avatarSrc, id) {
    var row = document.createElement('div');
    row.className = 'row ' + (kind === 'me' ? 'me' : 'other');
    if (id) row.dataset.id = id;
    var av = document.createElement('div');
    av.className = 'avatar';
    if (avatarSrc) av.style.backgroundImage = 'url("' + avatarSrc + '")';
    wireAvatar(av,kind==='me'?'me':'other',row);
    var bub = document.createElement('div');
    bub.className = 'bubble';
    bub.textContent = text;row._messageText=text;
    row.appendChild(av); row.appendChild(bub);
    row.addEventListener('click', function () { if (selectMode) toggleSelect(row); });
    attachLongPress(row);
    msgs.appendChild(row);
    scrollBottom();
    return row;
  }

  function addAssistantImage(message) {
    var row=addRow('other','',cfg.avatarOther,message.id),bubble=row.querySelector('.bubble');
    var img=document.createElement('img');
    img.src=message.image+'&device='+encodeURIComponent(deviceId);
    img.alt='助手发来的图片';img.style.cssText='display:block;max-width:100%;max-height:420px;border-radius:10px';
    row._messageText='';bubble.classList.add('media-bubble');
    img.addEventListener('click',function(e){e.stopPropagation();if(selectMode){toggleSelect(row);return;}document.getElementById('imagePreview').src=img.src;document.getElementById('imageViewer').hidden=false;});
    img.onload=scrollBottom;bubble.appendChild(img);
  }
  function addAssistantAudio(message) {
    var key='assistant:'+message.id;
    var rec={id:key,transcript:message.text||'',durationMs:message.duration_ms||0,status:'sent',audioUrl:message.audio+'&device='+encodeURIComponent(deviceId),assistant:true};
    voiceRecords[key]=rec;
    return addVoiceRow(rec,{id:message.id,side:'other'});
  }

  function addIncomingFile(message){
    var row=addRow('me','',cfg.avatarMe,message.id),bubble=row.querySelector('.bubble');
    row._messageText=message.text||'附件';
    if(message.kind==='image'&&message.image){
      var image=document.createElement('img');image.src=message.image+'&device='+encodeURIComponent(deviceId);image.alt=message.text||'我发送的图片';
      image.style.cssText='display:block;max-width:100%;max-height:320px;border-radius:10px';bubble.classList.add('media-bubble');bubble.appendChild(image);
      image.addEventListener('click',function(e){e.stopPropagation();if(selectMode){toggleSelect(row);return;}document.getElementById('imagePreview').src=image.src;document.getElementById('imageViewer').hidden=false;});image.onload=scrollBottom;
    }else{
      var name=document.createElement('div');name.className='file-name';name.textContent='📎 '+(message.text||'文件');bubble.appendChild(name);
      var note=document.createElement('div');note.className='file-note';note.textContent='已上传到电脑';bubble.appendChild(note);
    }
    return row;
  }

  var uploadItems=[],uploadingFiles=false;
  function nextUploadId(){return window.crypto&&crypto.randomUUID?crypto.randomUUID():'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,function(c){var r=Math.random()*16|0;return(c==='x'?r:(r&3|8)).toString(16);});}
  function renderUploads(){
    var list=document.getElementById('uploadList');list.replaceChildren();
    uploadItems.forEach(function(item){var row=document.createElement('div');row.className='upload-file';var label=document.createElement('span');label.textContent=item.file.name+' · '+(item.file.size/1048576).toFixed(2)+' MiB';var remove=document.createElement('button');remove.textContent='移除';remove.disabled=uploadingFiles;remove.onclick=function(){uploadItems=uploadItems.filter(function(x){return x!==item;});renderUploads();};row.appendChild(label);row.appendChild(remove);list.appendChild(row);});
    document.getElementById('uploadConfirm').disabled=uploadingFiles||!uploadItems.length;document.getElementById('uploadClose').disabled=uploadingFiles;
    document.getElementById('pickImages').disabled=uploadingFiles;document.getElementById('pickFiles').disabled=uploadingFiles;
  }
  function chooseFiles(event){
    Array.from(event.target.files||[]).forEach(function(file){
      var image=/\.(png|jpe?g|gif|webp|bmp|tiff?|heic|heif)$/i.test(file.name),limit=(image?10:32)*1048576;
      if(!file.size||file.size>limit){toastText(file.name+'：文件为空或超过'+(image?10:32)+'MiB');return;}
      if(uploadItems.length>=6){toastText('每次最多选择6个文件');return;}
      uploadItems.push({id:nextUploadId(),file:file});
    });event.target.value='';renderUploads();
  }
  function uploadOne(item){return new Promise(function(resolve,reject){
    var request=new XMLHttpRequest(),url='/api/wechat/assistant/upload?id='+encodeURIComponent(item.id)+'&name='+encodeURIComponent(item.file.name)+'&device='+encodeURIComponent(deviceId);
    if(clientId)url+='&client='+encodeURIComponent(clientId);
    request.open('POST',url);request.timeout=120000;request.setRequestHeader('Content-Type','application/octet-stream');request.setRequestHeader('x-whale-device',deviceId);
    request.upload.onprogress=function(e){document.getElementById('uploadStatus').textContent=item.file.name+' · '+(e.lengthComputable?Math.round(e.loaded/e.total*100)+'%':'上传中');};
    request.onload=function(){var result;try{result=JSON.parse(request.responseText);}catch(e){}if(request.status===200&&result&&result.ok)resolve(result);else reject(new Error(result&&result.error||'上传失败，原文件保留，可手动重试'));};
    request.onerror=request.ontimeout=function(){reject(new Error('上传结果未确认，可用同一编号手动重试，不会重复创建任务'));};request.send(item.file);
  });}
  document.getElementById('attachBtn').onclick=function(){document.getElementById('uploadOverlay').hidden=false;renderUploads();};
  document.getElementById('uploadClose').onclick=function(){if(!uploadingFiles)document.getElementById('uploadOverlay').hidden=true;};
  document.getElementById('pickImages').onclick=function(){document.getElementById('messageImages').click();};
  document.getElementById('pickFiles').onclick=function(){document.getElementById('messageFiles').click();};
  document.getElementById('messageImages').onchange=chooseFiles;document.getElementById('messageFiles').onchange=chooseFiles;
  document.getElementById('uploadConfirm').onclick=async function(){
    if(uploadingFiles||!uploadItems.length)return;uploadingFiles=true;renderUploads();
    try{for(var item of uploadItems.slice()){await uploadOne(item);uploadItems=uploadItems.filter(function(x){return x!==item;});}
      document.getElementById('uploadOverlay').hidden=true;toastText('附件已上传，可继续发文字说明；资料处理完成后交给智能体');
    }catch(error){document.getElementById('uploadStatus').textContent=error.message;toastText(error.message);}
    finally{uploadingFiles=false;renderUploads();}
  };

  document.getElementById('assistantManagerBtn').addEventListener('click',function(){
    openManager();
  });
  function addAssistant(text,id){addRow('other',text,cfg.avatarOther,id);}

  function setStatus(text) {
    removeStatus();
    if (text === null || text === undefined || text === '') return;
    statusRow = document.createElement('div');
    statusRow.className = 'row other status';
    var av = document.createElement('div');
    av.className = 'avatar';
    if (cfg.avatarOther) av.style.backgroundImage = 'url("' + cfg.avatarOther + '")';
    av.addEventListener('click', function () { showAvatarMenu('other'); });
    var bub = document.createElement('div');
    bub.className = 'bubble';

  /* ── 服务端通信 ────────────────────────── */
  function api(path, opts) {
    opts = opts || {};
    opts.headers = opts.headers || {};
    if (deviceId) opts.headers['x-whale-device'] = deviceId;
    var sep = path.indexOf('?') >= 0 ? '&' : '?';
    if (deviceId) { path = path + sep + 'device=' + encodeURIComponent(deviceId); sep = '&'; }
    if (clientId) path = path + sep + 'client=' + encodeURIComponent(clientId);
    // Time out even if fetch/body never settles; never automatically replay writes.
    var controller = typeof AbortController === 'function' ? new AbortController() : null;
    if (controller && !opts.signal) opts.signal = controller.signal;
    var timer;
    var timeout = new Promise(function (_, reject) {
      timer = setTimeout(function () {
        if (controller) controller.abort();
        reject(new Error('连接超时'));
      }, opts.method && opts.method !== 'GET' ? 120000 : 12000);
    });
    return Promise.race([fetch(path, opts).then(function (r) { return r.json(); }), timeout]).then(function (value) {
      clearTimeout(timer); return value;
    }, function (error) { clearTimeout(timer); throw error; });
  }

  var assistantWorkflow=false;
  var stateLoading=false, stateRetryTimer=null;
  function connectionNotice(visible) {
    document.getElementById('networkNotice').hidden=!visible;
  }
  function loadState() {
    if (stateLoading) return;
    stateLoading=true;
    clearTimeout(stateRetryTimer); stateRetryTimer=null;
    api('/api/wechat/state').then(function (s) {
      if (s && (s.paired === false || s.code === 'unpaired')) { connectionNotice(false); showGuide(); return; }
      if (!s || s.paired !== true) throw new Error('服务暂时不可用');
      connectionNotice(false);
      assistantWorkflow=!!s.workflow;
      cfg = {
        nickname: s.nickname || cfg.nickname,
        avatarOther: s.avatarOther || '',
        avatarMe: s.avatarMe || ''
      };
      titleText.textContent = cfg.nickname;
      showChat();
      if (s.background) applyBackground(s.background);
      (s.hiddenIds || []).forEach(function (id) { hiddenSet[id] = true; });
      bindVoiceHistory(s.history || []).then(function (voiceByMsg) {
        (s.history || []).forEach(function (m) {
          if (m.id && hiddenSet[m.id]) return;
          if (m.id && seenMsgIds[m.id]) return;
          if (m.id) seenMsgIds[m.id] = true;
          // 语音产生的消息就地渲染成语音条，不再重复显示【语音】文本气泡；
          // 必须在这里按历史顺序插入，否则所有语音条都会跑到列表末尾。
          if (m.role === 'user' && typeof m.text === 'string' && m.text.indexOf('【语音】') === 0) {
            var rec = voiceByMsg[m.id];
            if (rec) {
              voiceRecords[rec.id] = rec;
              upsertVoice(rec, { id: m.id });
            } else addRow('me',m.text,cfg.avatarMe,m.id);
            return;
          }
          if (m.role === 'user' && (m.kind==='image'||m.kind==='file')) addIncomingFile(m);
          else if (m.role === 'user') addRow('me', m.text, cfg.avatarMe, m.id);
          else if(m.kind==='image'&&m.image)addAssistantImage(m);else if(m.kind==='audio'&&m.audio)addAssistantAudio(m);else addAssistant(m.text, m.id);
        });
        lastSeq=Math.max(lastSeq,Number(s.seq)||0);
        startPolling();
      });
      sttReady = !!(s.stt && s.stt.ready);
      busy=!!s.busy;
      if (s.busy) setStatus('正在思考');
      else removeStatus();
      showDispatchAttention(s.dispatch_attention);


    }).catch(function () {
      connectionNotice(true);
      stateRetryTimer=setTimeout(loadState,5000);
    }).then(function () { stateLoading=false; });
  }

  var lastDispatchNotice='';
  function showDispatchAttention(value){
    if(!value||!value.task_id||lastDispatchNotice===value.task_id+':'+value.state)return;
    lastDispatchNotice=value.task_id+':'+value.state;
    toastText(value.message||'上一条会话投递异常，可以继续发送新消息。');
  }
  function handleEvent(m) {
    if (!m || !m.type) return;
    if (m.type === 'user') {
      if (m.id && hiddenSet[m.id]) return;
      if(m.kind==='image'||m.kind==='file'){if(m.id&&seenMsgIds[m.id])return;if(m.id)seenMsgIds[m.id]=true;addIncomingFile(m);return;}
      // 语音产生的文本由语音条表示：只回填语音条的 message id，不再插入文本气泡
      if (typeof m.text === 'string' && m.text.indexOf('【语音】') === 0) {
        if (!m.id || seenMsgIds[m.id]) return;
        seenMsgIds[m.id] = true;
        var vrow = pendingVoiceRow();
        if (vrow) vrow.dataset.id = m.id;
        else {
          // Keep the chronological slot while fetching this message's audio.
          var anchor=addRow('me',m.text,cfg.avatarMe,m.id);
          bindVoiceHistory([m]).then(function(byMsg){
            var rec=byMsg[m.id];
            if(!rec||!anchor.parentNode||hiddenSet[m.id])return;
            voiceRecords[rec.id]=rec;
            addVoiceRow(rec,{id:m.id,before:anchor});anchor.remove();
          });
        }
        return;
      }
      if (m.id) {
        if (seenMsgIds[m.id]) return;
        seenMsgIds[m.id] = true;
        // 用服务器下发的稳定 id 回填乐观渲染的那条待定气泡
        var pending = msgs.querySelector('.row.me[data-pending="1"]');
        if (pending) {
          pending.dataset.id = m.id;
          pending.removeAttribute('data-pending');
        } else {
          addRow('me', m.text, cfg.avatarMe, m.id);
        }
      } else {
        addRow('me', m.text, cfg.avatarMe);
      }
    } else if (m.type === 'status') {
      setStatus(m.text || '正在思考');
    } else if (m.type === 'busy') {
      if (m.value) { busy = true; if (!statusRow) setStatus('正在思考'); }
      else { busy = false; removeStatus(); }
    } else if (m.type === 'dispatch_attention') {
      showDispatchAttention(m);
    } else if (m.type === 'assistant') {
      if (m.id && hiddenSet[m.id]) return;
      if (m.id) {
        if (seenMsgIds[m.id]) return;
        seenMsgIds[m.id] = true;
      }
      removeStatus();
      if(m.kind==='image'&&m.image)addAssistantImage(m);else if(m.kind==='audio'&&m.audio)addAssistantAudio(m);else addAssistant(m.text, m.id);

    } else if (m.type === 'error') {
      removeStatus();
      toastText(m.message || '出错了');
    }
  }

  var pollInFlight=false;
  function startPolling() {
    if (pollTimer || pollInFlight) return;
    var tick = function () {
      pollTimer=null;
      if (pollInFlight) return;

      api('/api/wechat/poll?since=' + lastSeq).then(function (r) {

        (r.events || []).forEach(handleEvent);
        lastSeq = r.seq || lastSeq;
      }).catch(function () { connectionNotice(true); }).then(function () {
        pollInFlight=false;
        pollTimer = setTimeout(tick, 1500);
      });
    };
    tick();
  }

    }).then(function (r) {

          var row=voiceRows[rec.id];

      for (var i = 0; i < history.length; i++) {
        var m = history[i];
        if (m.role !== 'user' || typeof m.text !== 'string' || m.text.indexOf('【语音】') !== 0) continue;
        var rec=byStableId[String(m.id||'').split(':').pop()];
        if(!rec)continue;

    inputbar.style.bottom = kb + 'px';
    msgs.style.bottom = (inputbar.offsetHeight + kb) + 'px';
  }
  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', syncLayout);
    window.visualViewport.addEventListener('scroll', syncLayout);
  }
  window.addEventListener('resize', syncLayout);

  loadState();
})();
</script>
</body>
</html>

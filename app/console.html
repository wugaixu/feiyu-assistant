nt-size:15px;margin:6px 0}.connection-card small{display:block;color:var(--muted);font-size:11px}.connection-card.active{border-color:#9babef;box-shadow:0 0 0 2px #4263eb0d}.connection-card .conn-icon{display:grid;place-items:center;width:32px;height:32px;border-radius:9px;background:#eff3ff;color:#4b67cc;font-size:15px}.save-footer{position:sticky;bottom:14px;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 20px;border:1px solid #dce3f2;border-radius:12px;background:#ffffffed;backdrop-filter:blur(12px);margin-top:20px;z-index:5}.save-footer span{font-size:12px;color:var(--muted)}.empty-state{text-align:center;padding:36px 16px;color:var(--muted)}.nav-shade{display:none}.mobile-context{display:none}

<body>
<header>
<button class="icon-button menu-toggle" type="button" onclick="toggleNavigation()" aria-label="打开导航" aria-controls="nav" aria-expanded="false">☰</button>
<div><h1>肥鱼助手 <span class="header-context">/ 管理台</span></h1><span id="mobile-context" class="mobile-context">工作台</span></div><span class="sp"></span>
<span id="hstatus" class="muted"></span><span id="ui-version" class="mono" title="页面版本"></span>
<button class="icon-button" onclick="refreshView()" aria-label="刷新当前页面" title="刷新当前页面">↻</button>
</header>
<button id="nav-shade" class="nav-shade" type="button" onclick="toggleNavigation(false)" aria-label="关闭导航"></button>
<nav id="nav" aria-label="管理台功能"></nav>
<div id="ui-update" class="card hidden" role="status"></div><div id="load-error" class="card hidden" role="alert"></div>
<main id="main" aria-live="polite"></main><div id="toast" class="toast" role="status"></div>
<script>
const TABS=[['overview','工作台'],['channels','连接与账号'],['sessions','智能体与会话'],['capabilities','能力与工具'],['groups','群聊回复'],['activity','自动活动'],['tasks','消息记录'],['comments','作品评论'],['settings','资源与发送'],['logs','诊断与维护']];
const PAGE_COPY={overview:['OVERVIEW','连接、处理与发送的当前状态'],channels:['CONNECTIONS','管理抖音、QQ和鲸聊连接，以及主动消息去向'],sessions:['AGENT','选择负责处理新消息的智能体和会话'],capabilities:['CAPABILITIES','语音、生图和模型工具的运行状态与入口'],groups:['GROUPS','设置允许自动回复的抖音群和成员'],activity:['AUTOMATION','推荐作品分享，以及情绪日记触发的主动联系'],tasks:['MESSAGES','处理进度、回复内容和各通道发送回执'],comments:['COMMENTS','独立管理作品简评、主人提及与主站登录'],settings:['RESOURCES','保存位置、资源保留和私信发送设置'],logs:['DIAGNOSTICS','故障排查、运行日志与程序控制']};
const EDIT_TABS=['settings','activity','groups','comments'];
const UI_REVISION='__UI_REVISION__';
if(window.__WHALE_REMOTE__)document.getElementById('manual-image-entry')?.classList.add('hidden');
let channelView="douyin", current="overview", timer=null, loadSequence=0, settingsDirty=false, commentLoginActive=false;
try{const saved=sessionStorage.getItem('management-tab');if(saved==='qq'){current='channels';channelView='qq';}else if(TABS.some(([k])=>k===saved))current=saved;}catch{}

if(window.__WHALE_REMOTE__&&current==='logs')current='overview';
const remoteReads=new Map(),remotePending=new Map();let remoteReadEpoch=0,remotePaused=false;
async function api(path,opts){
 const key=path,read=!opts||!opts.method||opts.method==='GET',remote=window.__WHALE_REMOTE__;
 if(remote&&read){const old=remoteReads.get(key);if(old&&Date.now()-old.at<2500)return old.value;if(remotePending.has(key))return remotePending.get(key);}
 if(!read){remoteReads.clear();remotePending.clear();remoteReadEpoch++;}
 const epoch=remoteReadEpoch;
 const job=(async()=>{
  if(remote)path='/api/wechat/assistant/manage?path='+encodeURIComponent(path)+'&device='+encodeURIComponent(window.__WHALE_REMOTE_DEVICE__||'');
  const controller=new AbortController(), timeout=setTimeout(()=>controller.abort(),15000);
  try{const r=await fetch(path,{...opts,cache:'no-store',signal:controller.signal});if(!r.ok)throw new Error((await r.json()).error||r.status);const value=await r.json();if(remote&&read&&epoch===remoteReadEpoch)remoteReads.set(key,{at:Date.now(),value});return value;}
  catch(e){if(e.name==='AbortError')throw new Error('请求超过15秒，请检查管理台服务');throw e;}
  finally{clearTimeout(timeout);}
 })();
 if(remote&&read)remotePending.set(key,job);
 try{return await job;}finally{if(remotePending.get(key)===job)remotePending.delete(key);}
}
const post=(p,b)=>api(p,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(b)});
function toast(msg){const t=document.getElementById("toast");t.textContent=msg;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),2200);}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function ago(ms){if(!ms&&ms!==0)return"-";const s=Math.floor(ms/1000);if(s<60)return s+"秒前";const m=Math.floor(s/60);if(m<60)return m+"分钟前";const h=Math.floor(m/60);if(h<24)return h+"小时前";return Math.floor(h/24)+"天前";}
const sid=id=>id?String(id).replace(/^session-/,"").slice(0,8)+"…": "-";
function dispText(d){d=d||{};const s=d.state||"—";if(s==="error")return `<span style="color:#e5544b">错误 ${esc(d.error_class||"")}</span>`;if(s==="queued")return `已投递 ${esc(sid(d.task_id))}`;return esc(s);}

function toggleNavigation(open){
 const body=document.body;if(!body?.classList)return;
 const active=typeof open==='boolean'?open:!body.classList.contains('nav-open');body.classList.toggle('nav-open',active);
 document.querySelector('.menu-toggle')?.setAttribute('aria-expanded',String(active));
}
function renderNav(){
 const groups=[['工作空间',['overview','channels','sessions','capabilities']],['自动运行',['groups','activity']],['记录与维护',['tasks','comments','settings','logs']]];
 const symbols={overview:'◈',channels:'⇄',sessions:'✦',capabilities:'◇',groups:'◎',activity:'◷',tasks:'≡',comments:'◌',settings:'▤',logs:'⌘'};
 document.getElementById('nav').innerHTML='<div class="brand"><span class="brand-mark">F</span><div><strong>肥鱼助手</strong><small>FEIYU WORKSPACE</small></div></div>'+groups.map(([label,keys])=>'<div><div class="nav-group-label">'+label+'</div><div class="nav-group">'+keys.filter(k=>!(window.__WHALE_REMOTE__&&k==='logs')).map(k=>`<button data-tab="${k}" class="${k===current?'active':''}" ${k===current?'aria-current="page"':''}><span class="nav-symbol" aria-hidden="true">${symbols[k]}</span>${TABS.find(x=>x[0]===k)[1]}</button>`).join('')+'</div></div>').join('')+'<div class="nav-footer">'+(window.__WHALE_REMOTE__?'已配对设备 · 手机管理':'本地工作流 · 原通道回复')+'</div>';
 document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>openTab(b.dataset.tab));
 const caption=document.getElementById('mobile-context');if(caption)caption.textContent=TABS.find(x=>x[0]===current)?.[1]||'工作台';
}
function pageHeading(tab){const item=TABS.find(x=>x[0]===tab);const copy=PAGE_COPY[tab]||['',''];return `<div class="page-heading"><div><div class="eyebrow">${copy[0]}</div><h2>${esc(item?.[1]||'工作台')}</h2><p>${esc(copy[1])}</p></div><button class="btn" onclick="refreshView()">刷新状态 ↻</button></div>`;}
function refreshView(){if(settingsDirty&&EDIT_TABS.includes(current)&&!confirm('当前有尚未保存的修改，刷新会丢弃它们。继续？'))return;settingsDirty=false;load();}

function dot(on,warn){return `<span class="dot ${on?'ok':(warn?'warn':'bad')}"></span>`;}

const remoteTabCache=new Map();
async function load(){clearTimeout(timer);
  const sequence=++loadSequence, tab=current;
  try{sessionStorage.setItem('management-tab',tab);}catch{}
  const el=document.getElementById("main");
  if(window.__WHALE_REMOTE__&&el.dataset.view!==tab){
    const cached=remoteTabCache.get(tab);
    if(cached)el.replaceChildren(...cached.nodes);
    else{const waiting=document.createElement('div');waiting.className='card muted';waiting.textContent='正在加载…';el.replaceChildren(waiting);}
    el.dataset.view=tab;
    if(EDIT_TABS.includes(tab))el.oninput=el.onchange=checkSettingsDirty;
  }
  const staging=document.createElement('div');
  try{
    if(tab==="overview")await renderOverview(staging);
    else if(tab==="sessions")await renderSessions(staging);
    else if(tab==="channels")await renderChannels(staging);
    else if(tab==="capabilities")await renderCapabilities(staging);
    else if(tab==="tasks")await renderTasks(staging);
    else if(tab==="comments")await renderComments(staging);
    else if(tab==="logs")await renderLogs(staging);
    else if(tab==="settings")await renderSettings(staging);
    else if(tab==="activity")await renderActivity(staging);
    else if(tab==="groups")await renderGroups(staging);
    if(sequence!==loadSequence)return;
    if(EDIT_TABS.includes(tab)&&settingsDirty)return;
    if(window.__WHALE_REMOTE__&&tab==='settings')staging.querySelectorAll('[id^="res_"]').forEach(input=>input.disabled=true);
    const heading=document.createElement('div');heading.innerHTML=pageHeading(tab);
    el.replaceChildren(heading,...staging.childNodes);el.dataset.view=tab;
    if(window.__WHALE_REMOTE__)remoteTabCache.set(tab,{nodes:[...el.childNodes]});
    if(staging.dataset.header)document.getElementById('hstatus').innerHTML=staging.dataset.header;
    document.getElementById('load-error').classList.add('hidden');
    if(EDIT_TABS.includes(tab)){
      el.querySelectorAll('input,select,textarea').forEach(input=>input.dataset.saved=input.type==='checkbox'?String(input.checked):input.value);
      settingsDirty=false;el.oninput=el.onchange=checkSettingsDirty;
    }
    else{el.oninput=el.onchange=null;}
  }catch(e){
    if(sequence!==loadSequence)return;
    const error=document.getElementById('load-error');
    error.innerHTML=`本次刷新失败：${esc(e.message)}。下方如有数据为上次成功结果，当前状态待核验。 <button class="btn small" onclick="load()">重试</button>`;
    error.classList.remove('hidden');document.getElementById('hstatus').textContent='状态未更新';
  }
  if(sequence===loadSequence&&!remotePaused&&!settingsDirty&&!['settings','sessions','activity','groups','capabilities','channels'].includes(current))timer=setTimeout(load,current==='comments'&&commentLoginActive?3000:12000);
}

let whaleDevices=[];
function whaleDeviceChoices(channel){
 if(channel.device_groups)return channel.device_groups;
 const groups=new Map();
 for(const d of channel.device_info||(channel.devices||[]).map((id,i)=>({id,name:'未命名设备 '+(i+1)}))){
  const key=d.display_group||(d.model?[d.platform,d.model,d.custom_name||''].join('|'):d.id);
  if(!groups.has(key))groups.set(key,[]);groups.get(key).push(d);
 }
 return [...groups.values()].map(items=>{
  items.sort((a,b)=>(b.last_seen||0)-(a.last_seen||0));
  const d=items.find(x=>x.id===channel.active?.device)||items[0];
  return {...d,pairings:items,pairing_count:items.length,last_seen:items[0].last_seen};
 });
}

async function maintainQueue(kind,index,action){
 const item=(window.__QUEUE_MAINTENANCE__?.[kind==='task'?'tasks':'sends']||[])[index];if(!item)return;
 const descriptions={end:'结束这轮任务并忽略迟到结果？本轮待发送回复及未发布评论会取消，已发出的内容保留。',cancel:'取消这一轮所有尚未发送的回复？已发送或尝试中的消息不会撤回。',close_attempt:'将超时发送结束为“结果不明”？不重发，少于5分钟的发送不会被关闭。',received:'确认这条回复确实已经收到？保留原始平台回执，只登记你的反馈。',missing:'登记这条回复未收到并结束关注？不会自动重发。',dismiss:'保留结果未知，并将该记录标记已处理？不会改变原始回执或重发。'};
 if(!confirm(descriptions[action]))return;
 try{await post('/api/maintenance',{kind,id:item.id,action,expected_status:item.status});toast('维护完成；未重发消息');load();}catch(e){toast('未修改：'+e.message);load();}
}

async function dismissUnknownSends(){
 const items=(window.__QUEUE_MAINTENANCE__?.sends||[]).filter(x=>x.status==='outcome_uncertain');
 if(!items.length){toast('当前没有结果不明的记录');return;}
 if(!confirm(`将当前列出的 ${items.length} 条结果不明记录全部标记已处理？原始结果保持未知，不重发；正在处理和等待发送的消息不受影响。`))return;
 let count=0,changed=0;
 for(const item of items){try{await post('/api/maintenance',{kind:'send',id:item.id,action:'dismiss',expected_status:item.status});count++;}catch(e){changed++;}}
 toast(`已处理 ${count} 条${changed?`，${changed} 条未成功，请刷新后检查`:''}；未重发消息`);load();
}

 const field=(id,label,value,min,max)=>`<label class="sw">${label} <input id="${id}" type="number" min="${min}" ${max==null?'':`max="${max}"`} value="${value}" style="width:132px;min-width:132px;flex:0 0 132px;padding:9px 12px;font-size:15px"></label>`;
 const toggle=(id,label,on)=>`<label class="sw"><input id="${id}" type="checkbox" ${on?'checked':''}>${label}</label>`;
 const status={attempted:'处理中',done:'已完成',deferred:'智能体决定暂不联系',skipped:'已跳过',unavailable:'未能取得内容',outcome_uncertain:'结果待检查'};
 const runtime={waiting:'等待下一次活动检查',busy:'私信或任务处理中，活动延后',requires_astrbot:'需在会话投递中选择 AstrBot',astrbot_offline:'AstrBot 尚未连接',sdk_offline:'抖音聊天尚未连接',sdk_update_required:'SDK需加载作品分享模块',started:'正在处理活动',skipped:'本次已跳过',error:'调度检查异常'};
 const reasons={awaiting_owner_reply:'等待主人回复，不追发',recent_conversation:'刚聊过，暂不打扰',minimum_gap:'未到最小间隔',random_skip:'本次随机跳过',expired:'已过时段',provider_changed:'处理主体已切换',daily_share_quota:'今日分享额度已用完',window_quota:'本时段视频额度已用完'};
 const jobs=s.jobs.map(j=>{let r={};try{r=JSON.parse(j.result||'{}');}catch{}return `<tr><td>${j.kind==='browse'?'刷视频选片':'主动聊天'}<div class="review-time">${esc(activityTime(j.created))}</div></td><td>${esc(status[j.status]||j.status)}</td><td>${esc(reasons[r.reason]||r.reason||r.error_class||(r.share_queued?'作品卡片及文字已入发送队列':r.reply_queued?'文字已入发送队列':''))}</td></tr>`;}).join('');
 el.innerHTML=`<section class="card"><h3>自主活动 · AstrBot</h3>${activityBackendReady?'':'<p style="color:var(--warn)">新版接入尚待管理台正常重启。</p>'}<p class="muted">仅在管理台应用运行且处理主体为 AstrBot 时调度。北京时间；重启保留计划，错过时段不补跑。收信和回复优先；这里只发私信，不发布评论或 @。</p><p>${esc(runtime[s.runtime?.state]||'等待调度器检查')}</p><div class="review-row"><span>下次选片：${esc(activityTime(s.plans.browse?.pending?.at))}</span></div><button class="btn small" onclick="load()">刷新活动状态</button></section>
 <section class="card" style="margin-top:12px"><h3>随机刷推荐视频 → 私信分享</h3>${toggle('act_browse','启用按时段随机选片',c.browse_enabled)}<p class="muted">普通抖音账号推荐流，不使用关键词搜索。按需读取隐藏的主站窗口，验证失败暂停该次活动。下载、抽帧及音频处理后，由 AstrBot 依据实际素材筛选娱乐/搞笑作品；没有合适作品就不发。</p><label>每行：开始时间–结束时间 | 最多分析视频数 | 最多唤醒次数<textarea id="act_windows" rows="4" style="display:block;width:100%;margin:8px 0">${esc(c.windows.map((w,i)=>`${w[0]}-${w[1]} | ${c.window_limits[i]} | ${c.window_wakes[i]}`).join('\n'))}</textarea></label>${field('act_perwake','每次最多分析',c.max_per_wake,1,5)}${field('act_shares','每天最多分享',c.daily_shares,1,10)}<p class="muted">今天已预留分析 ${s.videos_today} 个；每次最多分享一条有内容依据的作品。失败或结果不明不重发。</p></section>
 <section class="card" style="margin-top:12px"><h3>情绪日记 · 主动消息</h3><p><b>${diary.selected_astrbot?(plugin.enabled===false?'插件已关闭主动消息':diary.bridge_fresh?'由情绪日记插件触发':plugin.updated_at?'插件状态待检查，请查看最近巡检':'等待插件首次巡检'):'当前所选会话未接入情绪日记，主动联系暂停'}</b></p><p class="muted">主动联系只由 AstrBot 情绪日记插件决定，依据日记、约定、情绪与作息寻找话题；插件按巡检间隔检查条件，命中后才唤醒当前会话的 AI 生成内容；AI 不在后台持续自行思考。工作流负责统一排队并按本轮保存的通道发送，主动发送通道可在“连接与账号”修改。每日额度是上限，不是每天必发次数；没有合适素材时保持静默。</p><div class="review-row"><span>最近巡检：${plugin.checked_at?esc(activityTime(plugin.checked_at)):'尚未巡检'}</span><span>巡检间隔：${esc(plugin.patrol_minutes??'待同步')} 分钟</span><span>每日私聊额度：${esc(plugin.daily_limit_private??'待同步')}</span><span>最小间隔：${esc(plugin.min_interval_minutes??'待同步')} 分钟</span></div><p>${esc(plugin.reason||'加载插件后等待巡检状态同步')}</p><button class="btn" onclick="openAstrbotUi()">打开 AstrBot 管理页</button><p class="muted">在插件管理中打开“情绪日记”设置，统一调整开关、频率、免打扰与语音偏好。切换到 Codex/DSH 或其他会话会取消尚未发送的旧主动消息，返回后不补发。</p><table><thead><tr><th>触发 / 时间</th><th>发送状态</th></tr></thead><tbody>${(diary.recent||[]).map(j=>`<tr><td>${esc(({morning:'早安',goodnight:'晚安',promise:'约定跟进',diary:'日记话题',quiet:'久未联系',care:'关心',anniversary:'纪念日',signal:'心情暗号'})[j.slot]||j.slot||'插件主动联系')}<div class="review-time">${esc(activityTime(j.created))}</div></td><td>${esc(({pending:'等待处理',generating:'生成回复',queued:'已入发送队列',done:'平台已接受，实际收取未确认',cancelled:'已取消，不补发',outcome_uncertain:'结果不明，不重发'})[j.status]||j.status)}${j.detail?`<div class="muted">${esc(j.detail)}</div>`:''}</td></tr>`).join('')||'<tr><td colspan="2">暂无插件主动联系记录。</td></tr>'}</tbody></table></section>
 <section class="card" style="margin-top:12px"><h3>最近活动</h3><table><thead><tr><th>类型 / 时间</th><th>状态</th><th>结果</th></tr></thead><tbody>${jobs||'<tr><td colspan="3">尚无活动；保存并启用后在允许时段随机安排。</td></tr>'}</tbody></table><p class="muted">入队只表示已生成内容，平台接受与主人实际收到仍分别判断。发送记录见「消息记录」。</p></section><div class="save-footer"><span>修改后需保存；日记主动联系频率在插件中维护。</span><button class="btn primary" onclick="saveActivity()">保存选片设置</button></div>`;
}
async function saveActivity(){try{
 const number=id=>Number(document.getElementById(id).value),on=id=>document.getElementById(id).checked;
 const rows=document.getElementById('act_windows').value.trim().split(/\r?\n/).filter(Boolean).map(line=>{const m=line.match(/^\s*(\d{2}:\d{2})\s*[-–]\s*(\d{2}:\d{2})\s*\|\s*(\d+)\s*\|\s*(\d+)\s*$/);if(!m)throw Error('时段格式应为 10:30-12:30 | 6 | 2');return m;});
 const c={...activityConfig,browse_enabled:on('act_browse'),windows:rows.map(m=>[m[1],m[2]]),window_limits:rows.map(m=>Number(m[3])),window_wakes:rows.map(m=>Number(m[4])),max_per_wake:number('act_perwake'),daily_shares:number('act_shares')};
 await post('/api/activity',{config:c});settingsDirty=false;toast('已保存自主活动设置');load();
}catch(e){toast('保存失败：'+e.message);}}
renderNav();load();
if(window.__WHALE_REMOTE__&&parent!==window)parent.postMessage({type:'whale-manager-ready'},location.origin);
</script>
</body>

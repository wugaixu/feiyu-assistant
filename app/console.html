<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="/favicon.ico">
<title>抖音私信助手 · 管理台</title>
<style>
  :root{--bg:#0f1115;--panel:#171a21;--panel2:#1d2129;--line:#282d37;--fg:#e6e9ef;--muted:#8b93a1;
        --accent:#4c8dff;--ok:#35c46a;--warn:#e0a53b;--bad:#e5544b;--chip:#232938}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 "Microsoft YaHei",system-ui,Segoe UI,sans-serif}
  header{display:flex;align-items:center;gap:14px;padding:12px 18px;background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
  header h1{font-size:16px;margin:0;font-weight:600}
  header .sp{flex:1}
  .dot{width:9px;height:9px;border-radius:50%;display:inline-block;vertical-align:middle;margin-right:5px}
  .dot.ok{background:var(--ok)}.dot.bad{background:var(--bad)}.dot.warn{background:var(--warn)}
  nav{display:flex;gap:4px;padding:8px 14px 0;flex-wrap:wrap}
  nav button{background:transparent;border:1px solid transparent;color:var(--muted);padding:7px 13px;border-radius:8px;cursor:pointer;font-size:14px}
  nav button.active{background:var(--panel2);color:var(--fg);border-color:var(--line)}
  main{padding:16px 18px 60px;max-width:1180px;margin:0 auto}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px}
  .card h3{margin:0 0 8px;font-size:13px;color:var(--muted);font-weight:600;letter-spacing:.03em}
  .big{font-size:22px;font-weight:600}
  .btn{background:var(--panel2);border:1px solid var(--line);color:var(--fg);padding:7px 12px;border-radius:8px;cursor:pointer;font-size:13px}
  .btn:hover{border-color:#3a4150}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn.danger{background:#3a1f1e;border-color:#5a2b28;color:#ffd7d3}
  .btn.small{padding:4px 9px;font-size:12px}
  .chip{background:var(--chip);border:1px solid var(--line);border-radius:999px;padding:1px 8px;font-size:11px;color:var(--muted);margin-left:6px}
  .chip.on{background:#12351f;border-color:#1f5a34;color:#8ff0b3}
  .chip.tgt{background:#16294a;border-color:#2b4f8a;color:#a9c7ff}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{text-align:left;padding:8px 8px;border-bottom:1px solid var(--line);vertical-align:top}
  th{color:var(--muted);font-weight:600;position:sticky;top:0;background:var(--panel)}
  td.mono,.mono{font-family:ui-monospace,Consolas,monospace;font-size:12px;color:var(--muted)}
  .muted{color:var(--muted)}
  .right{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
  pre{background:#0b0d11;border:1px solid var(--line);border-radius:10px;padding:12px;overflow:auto;max-height:440px;font-size:12px;white-space:pre-wrap;word-break:break-all}
  input,select,textarea{background:var(--panel2);border:1px solid var(--line);color:var(--fg);border-radius:7px;padding:6px 9px;font-size:13px}
  label.sw{display:flex;align-items:center;gap:8px;padding:7px 0}
  .hidden{display:none}
  .toast{position:fixed;right:18px;bottom:18px;background:var(--panel2);border:1px solid var(--line);padding:10px 14px;border-radius:10px;opacity:0;transition:.3s}
  .toast.show{opacity:1}
  .tabsrow{display:flex;gap:8px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
  .monitor-head{display:flex;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:14px}
  .monitor-head h2{font-size:20px;margin:0 0 5px}
  .monitor-head .meta{margin-left:auto;text-align:right;font-size:12px;color:var(--muted)}
  .stage-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}
  .stage{position:relative;display:flex;flex-direction:column;min-height:174px;border-top:3px solid #3a4150}
  .stage-top{display:flex;align-items:center;gap:8px;justify-content:space-between;margin-bottom:12px}
  .stage h3{margin:0;color:var(--fg);font-size:14px}
  .state-badge{font-size:12px;padding:2px 9px;border-radius:99px;white-space:nowrap;background:#242a34;color:#b4bdca}
  .stage.ready,.stage.idle{border-top-color:#35b87a}.stage.busy{border-top-color:#4c8dff}
  .stage.note{border-top-color:#54677e}.note .state-badge{background:#222e3b;color:#afc0d3}
  .review-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:6px 0}
  .review-row select{max-width:100%;font-size:12px}.review-time{font-size:11px;color:var(--muted)}
  .review-text{white-space:pre-wrap;overflow-wrap:anywhere;max-width:560px}
  .destination{border:1px solid #2c4d65;background:linear-gradient(120deg,#192b3b,var(--panel));padding:22px;margin-bottom:18px}
  .destination .provider{font-size:26px;font-weight:700;color:#b8d5ff;margin:6px 0}
  .destination .session-name{font-size:18px;overflow-wrap:anywhere;margin-bottom:8px}
  .provider-tabs{display:flex;gap:8px;margin:16px 0}.provider-tabs button{flex:1;text-align:left;padding:14px}
  .picker select{width:100%;margin:10px 0;padding:8px}
  .picker select[size]{min-height:90px;max-height:300px}
  .picker select option{padding:9px;border-radius:5px}.picker input{width:100%;margin-top:10px}
  .picker-footer{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-top:14px}
  .session-advanced{margin-top:18px}.session-advanced summary{cursor:pointer;color:var(--muted)}
  .session-options{max-height:300px;overflow:auto;margin:12px 0}.candidate{display:flex;align-items:center;gap:8px;padding:8px 0}
  .stage.warn,.stage.unknown,.stage.blocked{border-top-color:#e0a53b}.stage.error{border-top-color:#e5544b}
  .ready .state-badge,.idle .state-badge{background:#143523;color:#95e8b8}.busy .state-badge{background:#162d50;color:#adceff}
  .warn .state-badge,.unknown .state-badge,.blocked .state-badge{background:#3b3019;color:#f2cf8c}.error .state-badge{background:#422322;color:#ffb4ad}
  .stage .detail{color:var(--muted);font-size:13px;line-height:1.6;flex:1}
  .stage-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:14px;font-size:12px;color:var(--muted)}
  .flow-hint{font-size:12px;color:var(--muted);margin:10px 0 16px;line-height:1.8}
  .pipeline{margin:12px 0 18px;padding:16px;border:1px solid var(--line);border-radius:12px;background:var(--card)}
  .pipeline-steps{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:10px 0}
  .pipeline-node{padding:9px 12px;border-radius:8px;background:rgba(75,136,255,.08);border:1px solid var(--line);font-size:13px}
  .pipeline-arrow{color:var(--muted)}
  .capability-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,310px),1fr));gap:14px;margin-top:14px}
  .capability-grid .card{margin:0!important}
  .capability-top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
  .capability-top h3{margin:0}
  .capability-facts{display:grid;grid-template-columns:72px minmax(0,1fr);gap:9px 12px;font-size:13px;margin:12px 0}
  .capability-facts dt{color:var(--muted)}.capability-facts dd{margin:0;overflow-wrap:anywhere}
  @media(max-width:640px){.monitor-head .meta{margin-left:0;text-align:left}.stage-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
  <h1>抖音私信助手 · 管理台</h1>
  <span class="sp"></span>
  <a id="manual-image-entry" class="btn small" style="text-decoration:none" href="http://127.0.0.1:8189/" target="_blank" rel="noopener noreferrer" title="文字 / 单图 / 多图参考生图；服务未启动时双击桌面“本地千问生图”">手动生图</a>
  <span id="hstatus" class="muted"></span>
  <span id="ui-version" class="mono" title="管理台页面版本"></span>
</header>
<div id="ui-update" class="card hidden" role="status" style="margin:12px 18px"></div>
<div id="load-error" class="card hidden" role="alert" style="margin:12px 18px"></div>
<nav id="nav"></nav>
<main id="main"></main>
<div id="toast" class="toast"></div>
<script>
const TABS=[["overview","概览"],["sessions","会话投递"],["groups","群聊"],["activity","自主活动"],["tasks","任务"],["comments","评论"],["logs","日志"],["settings","设置"]];
const UI_REVISION='__UI_REVISION__';
if(window.__WHALE_REMOTE__)document.getElementById('manual-image-entry')?.classList.add('hidden');
let current="overview", timer=null, loadSequence=0, settingsDirty=false, commentLoginActive=false;
try{const saved=sessionStorage.getItem('management-tab');if(TABS.some(([k])=>k===saved))current=saved;}catch{}

const remoteReads=new Map(),remotePending=new Map();let remoteReadEpoch=0,remotePaused=false;
async function api(path,opts){
 const key=path,read=!opts||!opts.method||opts.method==='GET',remote=window.__WHALE_REMOTE__;
 if(remote&&read){const old=remoteReads.get(key);if(old&&Date.now()-old.at<2500)return old.value;if(remotePending.has(key))return remotePending.get(key);}
 if(!read){remoteReads.clear();remotePending.clear();remoteReadEpoch++;}
 const epoch=remoteReadEpoch;
 const job=(async()=>{
  if(remote)path='/api/wechat/assistant/manage?path='+encodeURIComponent(path)+'&device='+encodeURIComponent(window.__WHALE_REMOTE_DEVICE__||'');
  const controller=new AbortController(), timeout=setTimeout(()=>controller.abort(),15000);
  try{const r=await fetch(path,{...opts,cache:'no-store',signal:controller.signal});if(!r.ok)throw new Error((await r.json()).error||r.status);const value=await r.json();if(remote&&read&&epoch===remoteReadEpoch)remoteReads.set(key,{at:Date.now(),value});return value;}
  catch(e){if(e.name==='AbortError')throw new Error('请求超过15秒，请检查管理台服务');throw e;}
  finally{clearTimeout(timeout);}
 })();
 if(remote&&read)remotePending.set(key,job);
 try{return await job;}finally{if(remotePending.get(key)===job)remotePending.delete(key);}
}
const post=(p,b)=>api(p,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(b)});
function toast(msg){const t=document.getElementById("toast");t.textContent=msg;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),2200);}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function ago(ms){if(!ms&&ms!==0)return"-";const s=Math.floor(ms/1000);if(s<60)return s+"秒前";const m=Math.floor(s/60);if(m<60)return m+"分钟前";const h=Math.floor(m/60);if(h<24)return h+"小时前";return Math.floor(h/24)+"天前";}
const sid=id=>id?String(id).replace(/^session-/,"").slice(0,8)+"…": "-";
function dispText(d){d=d||{};const s=d.state||"—";if(s==="error")return `<span style="color:#e5544b">错误 ${esc(d.error_class||"")}</span>`;if(s==="queued")return `已投递 ${esc(sid(d.task_id))}`;return esc(s);}

function renderNav(){document.getElementById("nav").innerHTML=TABS.map(([k,t])=>`<button data-tab="${k}" class="${k===current?'active':''}">${t}</button>`).join("");
  if(window.__WHALE_REMOTE__)document.querySelector('nav button[data-tab="logs"]')?.remove();
  document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>openTab(b.dataset.tab));}

function dot(on,warn){return `<span class="dot ${on?'ok':(warn?'warn':'bad')}"></span>`;}

const remoteTabCache=new Map();
async function load(){clearTimeout(timer);
  const sequence=++loadSequence, tab=current;
  try{sessionStorage.setItem('management-tab',tab);}catch{}
  const el=document.getElementById("main");
  if(window.__WHALE_REMOTE__&&el.dataset.view!==tab){
    const cached=remoteTabCache.get(tab);
    if(cached)el.replaceChildren(...cached.nodes);
    else{const waiting=document.createElement('div');waiting.className='card muted';waiting.textContent='正在加载…';el.replaceChildren(waiting);}
    el.dataset.view=tab;
    if(['settings','activity','groups'].includes(tab))el.oninput=el.onchange=checkSettingsDirty;
  }
  const staging=document.createElement('div');
  try{
    if(tab==="overview")await renderOverview(staging);
    else if(tab==="sessions")await renderSessions(staging);
    else if(tab==="tasks")await renderTasks(staging);
    else if(tab==="comments")await renderComments(staging);
    else if(tab==="logs")await renderLogs(staging);
    else if(tab==="settings")await renderSettings(staging);
    else if(tab==="activity")await renderActivity(staging);
    else if(tab==="groups")await renderGroups(staging);
    if(sequence!==loadSequence)return;
    if(window.__WHALE_REMOTE__&&['settings','activity','groups'].includes(tab)&&settingsDirty)return;
    el.replaceChildren(...staging.childNodes);el.dataset.view=tab;
    if(window.__WHALE_REMOTE__)remoteTabCache.set(tab,{nodes:[...el.childNodes]});
    if(staging.dataset.header)document.getElementById('hstatus').innerHTML=staging.dataset.header;
    document.getElementById('load-error').classList.add('hidden');
    if(['settings','activity','groups'].includes(tab)){
      el.querySelectorAll('input,select,textarea').forEach(input=>input.dataset.saved=input.type==='checkbox'?String(input.checked):input.value);
      settingsDirty=false;el.oninput=el.onchange=checkSettingsDirty;
    }
    else{el.oninput=el.onchange=null;}
  }catch(e){
    if(sequence!==loadSequence)return;
    const error=document.getElementById('load-error');
    error.innerHTML=`本次刷新失败：${esc(e.message)}。下方如有数据为上次成功结果，当前状态待核验。 <button class="btn small" onclick="load()">重试</button>`;
    error.classList.remove('hidden');document.getElementById('hstatus').textContent='状态未更新';
  }
  if(sequence===loadSequence&&!remotePaused&&!['settings','sessions','activity','groups'].includes(current))timer=setTimeout(load,current==='comments'&&commentLoginActive?3000:12000);
}

function checkSettingsDirty(){
 settingsDirty=[...document.querySelectorAll('#main input,#main select,#main textarea')].some(input=>input.dataset.saved!==(input.type==='checkbox'?String(input.checked):input.value));
}
function savedSettings(ids){
 ids.forEach(id=>{const input=document.getElementById(id);input.dataset.saved=input.type==='checkbox'?String(input.checked):input.value;});
 checkSettingsDirty();
}

function refreshUi(){
 if(settingsDirty&&!confirm('设置中有编辑内容，重新加载会丢弃尚未保存的修改。继续？'))return;
 settingsDirty=false;
 location.reload();
}
async function checkUiVersion(){
 if(remotePaused)return;
 try{
  const state=await api('/api/app/ping');
  if(!state.ui_revision||state.ui_revision===UI_REVISION)return;
  // Never interrupt a settings form, even before the first input event.
  if(['settings','activity','groups'].includes(current)){
   const notice=document.getElementById('ui-update');
   notice.innerHTML='管理台有新版本。请先保存设置，再重新加载。 <button class="btn small" onclick="refreshUi()">重新加载界面</button>';
   notice.classList.remove('hidden');
  }else if(!settingsDirty){location.reload();}
 }catch{/* Data refresh has its own visible error; never reload on a failed probe. */}
}
document.getElementById('ui-version').textContent='界面 '+UI_REVISION.slice(0,6);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)checkUiVersion();});
setInterval(checkUiVersion,15000);
window.addEventListener('message',e=>{
 if(!window.__WHALE_REMOTE__||e.source!==parent||e.origin!==location.origin)return;
 if(e.data?.type==='whale-manager-ping'){parent.postMessage({type:'whale-manager-ready'},location.origin);return;}
 if(e.data?.type==='whale-manager-reload'){refreshUi();return;}
 if(e.data?.type!=='whale-manager-visibility')return;
 remotePaused=e.data.visible!==true;if(remotePaused)clearTimeout(timer);else if(!settingsDirty)load();
});
window.addEventListener('beforeunload',e=>{if(settingsDirty&&['settings','activity','groups'].includes(current)){e.preventDefault();e.returnValue='';}});

async function renderOverview(el){
  const s=await api("/api/overview");
  const wf=s.workflow, app=wf.app||{}, sdk=wf.sdk||{}, rec=wf.receiver||{};
  el.dataset.header=dot(sdk.online)+(sdk.online?"抖音 SDK 在线":"抖音 SDK 离线")+" · "+esc(sdk.nickname||"");
  const counts=s.counts||{};
  const taskLabels={done:'已完成',failed:'处理失败',needs_input:'等待补充',pending:'待处理',processing:'处理中',resource_saved:'资料已保存',media_pending:'媒体准备中'};
  const cchips=Object.keys(counts).length?Object.entries(counts).map(([k,v])=>`<span class="chip">${esc(taskLabels[k]||k)} ${v}</span>`).join(""):'<span class="muted">无</span>';
  const modules=s.health?.modules||[];
  const normal=modules.filter(x=>['ready','idle'].includes(x.state)).length, busy=modules.filter(x=>x.state==='busy').length, attention=modules.filter(x=>['warn','error','blocked','unknown'].includes(x.state)).length, off=modules.filter(x=>x.state==='off').length, notes=modules.filter(x=>x.state==='note').length;
  const checks=new Date((s.health?.checked_at||s.now)*1000).toLocaleTimeString('zh-CN',{hour12:false,timeZone:'Asia/Shanghai'});
  const resultLabels={not_applicable:'本次素材无需此步骤',done:'已完成',saved:'已保存',partial:'部分完成',failed:'处理失败',unavailable:'暂未取得',no_audio:'没有音轨',no_speech_recognized:'未识别出语音'};
  const cards=modules.map(x=>`<article class="card stage ${esc(x.state)}" data-stage="${esc(x.id)}"><div class="stage-top"><h3>${esc(x.title)}</h3><span class="state-badge">${esc(x.label)}</span></div><div class="detail">${esc(x.detail)}</div><div class="stage-foot"><span>${esc(String(x.metric||'').replace(/\b(not_applicable|done|saved|partial|failed|unavailable|no_audio|no_speech_recognized)\b/g,key=>resultLabels[key]))}</span><button class="btn small" onclick="openTab('${x.tab}')">查看</button></div></article>`).join('');
  el.innerHTML=`
  <div class="monitor-head"><div><h2>工作流运行监测</h2><div class="muted">${normal} 项就绪或待机 · ${busy} 项处理中 · ${attention} 项需关注${notes?` · ${notes} 项检查有备注`:''} · ${off} 项未启用</div></div><div class="meta">最近检查 ${esc(checks)}（北京时间）<br>每12秒刷新 <button class="btn small" onclick="load()">立即刷新</button></div></div>
  ${workflowFlowHtml(s.target.provider)}
  <div class="stage-grid">${cards||'<div class="card">监测状态暂不可用</div>'}</div>
  <p class="muted" style="font-size:12px">${esc(s.health?.note||'')}<br>管理台与工作流守护：运行 ${Math.floor((app.uptime||0)/60)} 分钟 · 服务进程 ${esc(app.pid||'—')}</p>
  <div class="card" style="margin-top:12px"><h3>任务状态计数</h3><div>${cchips}</div></div>
  <div class="card" style="margin-top:12px"><h3>工作流控制</h3>
    <div class="right" style="justify-content:flex-start">
      <button class="btn primary" onclick="wf('start')">启动工作流</button>
      <button class="btn" onclick="wf('stop')">停止工作流</button>
      <button class="btn danger" onclick="quitApp()">关闭程序</button>
    </div>
    <div class="muted" style="margin-top:8px">工作流随程序启动而启动、随程序关闭而关闭；关掉管理台窗口只是隐藏到托盘，程序仍在运行。</div></div>`;
}
function openTab(tab){
 if(['settings','activity','groups'].includes(current)&&settingsDirty){
  if(!confirm('设置有编辑内容，离开会丢弃尚未保存的修改。继续？'))return;
  settingsDirty=false;remoteTabCache.delete(current);
 }
 current=tab;renderNav();load();
}
async function wf(a){try{await post("/api/workflow",{action:a});toast("已执行："+a);setTimeout(load,1500);}catch(e){toast("失败："+e.message);}}
async function quitApp(){if(!confirm("关闭程序？将同时停止工作流并退出托盘。"))return;try{await post("/api/app/quit",{});document.body.innerHTML='<div style="padding:40px;color:#8b93a1">程序已关闭，可关闭此窗口。</div>';}catch(e){toast("失败："+e.message);}}

let pickerProvider=null;
const PROVIDER_LABEL={codex:"Codex",dsh:"DSH",astrbot:"AstrBot"};
const ASTRBOT_URL="http://127.0.0.1:6185/";
function workflowFlowHtml(provider){
 const name=PROVIDER_LABEL[provider]||'待选择';
 return `<section class="pipeline"><b>消息如何处理</b><div class="pipeline-steps"><span class="pipeline-node">抖音 SDK / 鲸聊网关 / QQ NapCat</span><span class="pipeline-arrow">→</span><span class="pipeline-node">身份核验 · 去重 · 本地队列</span><span class="pipeline-arrow">→</span><span class="pipeline-node">图片 / 视频 / 语音资料整理</span><span class="pipeline-arrow">→</span><span class="pipeline-node">${esc(name)} 分析与回复</span><span class="pipeline-arrow">→</span><span class="pipeline-node">原通道 · 原设备</span></div><div class="muted">视频与图集：DouK 保存作品 → 画面、评论与音频资料 → AI 分析。纯文字连续 5 秒无新消息后投递；含图片、语音、视频或文件的消息等待 10 秒关联后续文字。<br>语音回复：AstrBot 提供合成文字 → GPT-SoVITS 生成音频 → 鲸聊或 QQ 语音消息；鲸聊可展开合成原文。<br>作品公开评论是独立发布分支，按授权和开关执行；自主活动通过私信分享作品。日常收发不依赖网页抖音，也不依赖 DSH 进程；仅选择 DSH 处理消息时需要 DSH 在线。</div></section>`;
}
function voiceCapabilitiesHtml(voice){

function outboundContentHtml(item){
 const file=item.file_name?`<div class="review-time">${esc(item.file_name)}</div>`:'';

}

async function renderActivity(el){
 const s=await api('/api/activity'),c=s.config;activityConfig=c;const activityBackendReady=!!s.diary_proactive;const diary=s.diary_proactive||{},plugin=diary.plugin||{};
 const field=(id,label,value,min,max)=>`<label class="sw">${label} <input id="${id}" type="number" min="${min}" ${max==null?'':`max="${max}"`} value="${value}" style="width:132px;min-width:132px;flex:0 0 132px;padding:9px 12px;font-size:15px"></label>`;
 const toggle=(id,label,on)=>`<label class="sw"><input id="${id}" type="checkbox" ${on?'checked':''}>${label}</label>`;
 const status={attempted:'处理中',done:'已完成',deferred:'智能体决定暂不联系',skipped:'已跳过',unavailable:'未能取得内容',outcome_uncertain:'结果待检查'};
 const runtime={waiting:'等待下一次活动检查',busy:'私信或任务处理中，活动延后',requires_astrbot:'需在会话投递中选择 AstrBot',astrbot_offline:'AstrBot 尚未连接',sdk_offline:'抖音聊天尚未连接',sdk_update_required:'SDK需加载作品分享模块',started:'正在处理活动',skipped:'本次已跳过',error:'调度检查异常'};
 const reasons={awaiting_owner_reply:'等待主人回复，不追发',recent_conversation:'刚聊过，暂不打扰',minimum_gap:'未到最小间隔',random_skip:'本次随机跳过',expired:'已过时段',provider_changed:'处理主体已切换',daily_share_quota:'今日分享额度已用完',window_quota:'本时段视频额度已用完'};
 const jobs=s.jobs.map(j=>{let r={};try{r=JSON.parse(j.result||'{}');}catch{}return `<tr><td>${j.kind==='browse'?'刷视频选片':'主动聊天'}<div class="review-time">${esc(activityTime(j.created))}</div></td><td>${esc(status[j.status]||j.status)}</td><td>${esc(reasons[r.reason]||r.reason||r.error_class||(r.share_queued?'作品卡片及文字已入发送队列':r.reply_queued?'文字已入发送队列':''))}</td></tr>`;}).join('');
 el.innerHTML=`<section class="card"><h3>自主活动 · AstrBot</h3>${activityBackendReady?'':'<p style="color:var(--warn)">新版接入尚待管理台正常重启。</p>'}<p class="muted">仅在管理台应用运行且处理主体为 AstrBot 时调度。北京时间；重启保留计划，错过时段不补跑。收信和回复优先；这里只发私信，不发布评论或 @。</p><p>${esc(runtime[s.runtime?.state]||'等待调度器检查')}</p><div class="review-row"><span>下次选片：${esc(activityTime(s.plans.browse?.pending?.at))}</span></div><button class="btn small" onclick="load()">刷新活动状态</button></section>
 <section class="card" style="margin-top:12px"><h3>随机刷推荐视频 → 私信分享</h3>${toggle('act_browse','启用按时段随机选片',c.browse_enabled)}<p class="muted">普通抖音账号推荐流，不使用关键词搜索。按需读取隐藏的主站窗口，验证失败暂停该次活动。下载、抽帧及音频处理后，由 AstrBot 依据实际素材筛选娱乐/搞笑作品；没有合适作品就不发。</p><label>每行：开始时间–结束时间 | 最多分析视频数 | 最多唤醒次数<textarea id="act_windows" rows="4" style="display:block;width:100%;margin:8px 0">${esc(c.windows.map((w,i)=>`${w[0]}-${w[1]} | ${c.window_limits[i]} | ${c.window_wakes[i]}`).join('\n'))}</textarea></label>${field('act_perwake','每次最多分析',c.max_per_wake,1,5)}${field('act_shares','每天最多分享',c.daily_shares,1,10)}<p class="muted">今天已预留分析 ${s.videos_today} 个；每次最多分享一条有内容依据的作品。失败或结果不明不重发。</p></section>
 <section class="card" style="margin-top:12px"><h3>情绪日记 · 主动消息</h3><p><b>${diary.selected_astrbot?(plugin.enabled===false?'插件已关闭主动消息':diary.bridge_fresh?'由情绪日记插件触发':plugin.updated_at?'插件状态待检查，请查看最近巡检':'等待插件首次巡检'):'当前所选会话未接入情绪日记，主动联系暂停'}</b></p><p class="muted">主动联系只由 AstrBot 情绪日记插件决定，依据日记、约定、情绪与作息寻找话题；插件按巡检间隔检查条件，命中后才唤醒当前会话的 AI 生成内容；AI 不在后台持续自行思考。工作流负责统一排队并按本轮保存的通道发送，主动发送通道可在“会话投递”修改。每日额度是上限，不是每天必发次数；没有合适素材时保持静默。</p><div class="review-row"><span>最近巡检：${plugin.checked_at?esc(activityTime(plugin.checked_at)):'尚未巡检'}</span><span>巡检间隔：${esc(plugin.patrol_minutes??'待同步')} 分钟</span><span>每日私聊额度：${esc(plugin.daily_limit_private??'待同步')}</span><span>最小间隔：${esc(plugin.min_interval_minutes??'待同步')} 分钟</span></div><p>${esc(plugin.reason||'加载插件后等待巡检状态同步')}</p><button class="btn" onclick="openAstrbotUi()">打开 AstrBot 管理页</button><p class="muted">在插件管理中打开“情绪日记”设置，统一调整开关、频率、免打扰与语音偏好。切换到 Codex/DSH 或其他会话会取消尚未发送的旧主动消息，返回后不补发。</p><table><thead><tr><th>触发 / 时间</th><th>发送状态</th></tr></thead><tbody>${(diary.recent||[]).map(j=>`<tr><td>${esc(({morning:'早安',goodnight:'晚安',promise:'约定跟进',diary:'日记话题',quiet:'久未联系',care:'关心',anniversary:'纪念日',signal:'心情暗号'})[j.slot]||j.slot||'插件主动联系')}<div class="review-time">${esc(activityTime(j.created))}</div></td><td>${esc(({pending:'等待处理',generating:'生成回复',queued:'已入发送队列',done:'平台已接受，实际收取未确认',cancelled:'已取消，不补发',outcome_uncertain:'结果不明，不重发'})[j.status]||j.status)}${j.detail?`<div class="muted">${esc(j.detail)}</div>`:''}</td></tr>`).join('')||'<tr><td colspan="2">暂无插件主动联系记录。</td></tr>'}</tbody></table></section>
 <section class="card" style="margin-top:12px"><h3>最近活动</h3><table><thead><tr><th>类型 / 时间</th><th>状态</th><th>结果</th></tr></thead><tbody>${jobs||'<tr><td colspan="3">尚无活动；保存并启用后在允许时段随机安排。</td></tr>'}</tbody></table><p class="muted">入队只表示已生成内容，平台接受与主人实际收到仍分别判断。发送记录见「任务」。</p></section>`;
}
async function saveActivity(){try{
 const number=id=>Number(document.getElementById(id).value),on=id=>document.getElementById(id).checked;
 const rows=document.getElementById('act_windows').value.trim().split(/\r?\n/).filter(Boolean).map(line=>{const m=line.match(/^\s*(\d{2}:\d{2})\s*[-–]\s*(\d{2}:\d{2})\s*\|\s*(\d+)\s*\|\s*(\d+)\s*$/);if(!m)throw Error('时段格式应为 10:30-12:30 | 6 | 2');return m;});
 const c={...activityConfig,browse_enabled:on('act_browse'),windows:rows.map(m=>[m[1],m[2]]),window_limits:rows.map(m=>Number(m[3])),window_wakes:rows.map(m=>Number(m[4])),max_per_wake:number('act_perwake'),daily_shares:number('act_shares')};
 await post('/api/activity',{config:c});settingsDirty=false;toast('已保存自主活动设置');load();
}catch(e){toast('保存失败：'+e.message);}}
renderNav();load();
if(window.__WHALE_REMOTE__&&parent!==window)parent.postMessage({type:'whale-manager-ready'},location.origin);
</script>
</body>
